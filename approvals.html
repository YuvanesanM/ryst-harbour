<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://data.ryst.in; connect-src 'self' https://data.ryst.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<script src="/staff-demo.js"></script>
<script src="/property.js" data-staff></script>
<link rel="stylesheet" href="/assets/app/shell.css?v=df069d75">
<script src="/assets/app/shell.js?v=a8b9b9a4"></script>
<script src="/i18n.js"></script>
<title data-title="Payment approvals · {name}">Payment approvals · RYST 109A</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/staff.webmanifest">
<link rel="apple-touch-icon" href="/assets/staff-apple-touch-icon.png">
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/staff-sw.js').catch(()=>{}));</script>
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f3ee;--panel:#fff;--panel2:#f8f7f3;--line:#e6e2d9;--line2:#efece5;--ink:#1c2321;--ink2:#3a4440;--muted:#68716c;--muted2:#9aa09a;
  --teal:#2f7d6d;--teal-soft:#e6f2ee;--warn:#9a6a12;--warn-soft:#fbf1dc;--down:#b9483b;--down-soft:#f8e7e4;--r:14px;--shadow:0 1px 2px rgba(28,35,33,.04),0 6px 18px rgba(28,35,33,.04)}
html[data-theme="dark"]{--bg:#111715;--panel:#1a211e;--panel2:#202925;--line:#2c3531;--line2:#252d29;--ink:#e9e6df;--ink2:#cfd3cd;--muted:#a9b0aa;--muted2:#7f8781;--teal:#5fb3a1;--teal-soft:#1d2e29;--warn:#e0b25c;--warn-soft:#2e2717;--down:#e58a7d;--down-soft:#33201d}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 18px 90px}
.head{margin-bottom:14px}.head h1{font-size:24px;font-weight:700;letter-spacing:-.2px}.head p{color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.5}
.sec{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2);margin:20px 2px 10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.item .amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
.item .what{flex:1;min-width:200px;font-size:13.5px;line-height:1.45}
.item .what b{font-weight:650}.item .what small{display:block;color:var(--muted);font-size:12.5px}
.item .acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}
.btn.ok{background:var(--teal);border-color:var(--teal);color:#fff}.btn.no:hover{border-color:var(--down);color:var(--down)}
.btn:disabled{opacity:.55;cursor:default}.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.tag.approved{background:var(--teal-soft);color:var(--teal)}.tag.rejected{background:var(--down-soft);color:var(--down)}
.done{opacity:.85}.done .amt{font-size:16px}
.empty{color:var(--muted);font-size:13.5px;padding:14px 2px}
.err{color:var(--down);font-size:13px;margin-top:8px}
a.lnk{color:var(--teal);font-weight:600;text-decoration:none}
@media (max-width:520px){.wrap{padding:12px 12px 96px}.item .acts{width:100%}.item .acts .btn{flex:1;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Payment approvals</h1><p>Cash, UPI and card payments your team recorded. Each one counts as received only after you approve it. Rejecting a food payment puts the order back on the guest's unpaid bill.</p></div>
  <p class="sec">Waiting for you</p>
  <div id="pending"><div class="empty">Loading…</div></div>
  <p class="sec">Decided in the last 30 days</p>
  <div id="decided"></div>
  <p class="err" id="err" hidden></p>
</div>
<script>
(function () {
  const PROXY = 'https://data.ryst.in', TOKEN = localStorage.getItem('ryst_proxy_token') || '';
  if (!TOKEN) { location.href = 'login.html'; return; }
  if ((localStorage.getItem('ryst_user_role') || 'owner') !== 'owner' && localStorage.getItem('ryst_user_admin') !== 'true') { location.href = 'login.html'; return; }
  const $ = s => document.querySelector(s), t = s => (window.rystT ? window.rystT(s) : s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rs = v => '₹' + Math.round(Number(v) || 0).toLocaleString('en-IN');
  const when = ms => ms ? new Date(ms).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const who = e => esc(String(e || 'staff').split('@')[0]);
  const dm = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
  const what = x => x.kind === 'stay'
    ? `<b>${esc(x.guest || 'Guest')}</b> · <a class="lnk" href="stay.html?open=${encodeURIComponent(x.no)}">${esc(x.no)}</a>${x.checkin ? ' · ' + esc(dm(x.checkin)) + '–' + esc(dm(x.checkout)) : ''}`
    : `<b>Food order ${esc(x.no)}</b>${x.guest ? ' · ' + esc(x.guest) : ''}${x.stayNo ? ' · ' + esc(x.stayNo) : ''}`;
  function render(d) {
    const p = d.pending || [], dec = d.decided || [];
    $('#pending').innerHTML = p.length ? p.map(x => `<div class="item" data-kind="${esc(x.kind)}" data-no="${esc(x.no)}" data-id="${esc(x.id)}">
        <div class="amt">${rs(x.amount)}</div>
        <div class="what">${what(x)}<small>${esc(x.method || '')} · recorded by ${who(x.by)} · ${esc(when(x.at))}${x.note ? ' · ' + esc(x.note) : ''}</small></div>
        <div class="acts"><button class="btn no" type="button" data-d="reject">Reject</button><button class="btn ok" type="button" data-d="approve">Approve</button></div></div>`).join('')
      : `<div class="empty">${t('Nothing waiting. Payments your team records by hand show up here.')}</div>`;
    $('#decided').innerHTML = dec.length ? dec.map(x => `<div class="item done"><div class="amt">${rs(x.amount)}</div>
        <div class="what">${what(x)}<small>${esc(x.method || '')} · by ${who(x.by)} · <span class="tag ${esc(x.status)}">${esc(x.status)}</span> by ${who(x.decidedBy)} ${esc(when(x.decidedAt))}${x.reason ? ' · ' + esc(x.reason) : ''}</small></div></div>`).join('')
      : `<div class="empty">${t('None yet.')}</div>`;
  }
  async function load() {
    try {
      const r = await fetch(PROXY + '/payments/approvals', { headers: { 'X-Token': TOKEN }, cache: 'no-store' });
      if (r.status === 401) { localStorage.removeItem('ryst_proxy_token'); location.href = 'login.html'; return; }
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
      render(d);
    } catch (e) { $('#pending').innerHTML = `<div class="empty">${esc(e.message || 'Could not load')}</div>`; }
  }
  $('#pending').addEventListener('click', async e => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const it = b.closest('.item'), decision = b.dataset.d;
    let reason = '';
    if (decision === 'reject') { reason = prompt(t('Reject this payment? Say why (optional):'), ''); if (reason === null) return; }
    it.querySelectorAll('button').forEach(x => x.disabled = true);
    $('#err').hidden = true;
    try {
      const r = await fetch(PROXY + '/payments/approvals', { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: it.dataset.kind, no: it.dataset.no, id: it.dataset.id, decision, reason }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
    } catch (err) { $('#err').textContent = err.message; $('#err').hidden = false; }
    load();
  });
  load();
})();
</script>
</body>
</html>
