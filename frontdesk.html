<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://data.ryst.in https://harbour.ryst.in https://stay.ryst.in; connect-src 'self' https://data.ryst.in; object-src 'none'; base-uri 'self'; form-action 'self';">
<script src="/staff-demo.js"></script>
<script src="/property.js" data-staff></script>
<link rel="stylesheet" href="/assets/app/shell.css?v=df069d75">
<script src="/assets/app/shell.js?v=96e96d06"></script>
<title data-title="Front desk · {name}">Front desk · RYST Harbour</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/app/fonts.css?v=1">
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#9aa097;
    --danger:#c0584b; --danger-soft:#fbecea; --warn:#c98a2b; --warn-soft:#fbf3e6; --good:#2f7d54;
    /* room states */
    --s-occ:#2f6f8f; --s-arr:#3d9b69; --s-dep:#c98a2b; --s-day:#7a5fb0; --s-ooo:#8a8f87; --s-clean:#eaf4ee; --s-dirty:#fbecea; --s-insp:#dcefe4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  button,input,select{font-family:inherit} button{cursor:pointer} a{color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
  header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 16px}
  .ttl{font-weight:700;font-size:18px} .ttl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  .spacer{flex:1}
  .tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;text-decoration:none}
  .tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .datebar{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:3px}
  .datebar button{border:0;background:none;padding:6px 10px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)} .datebar button:hover{background:var(--panel2)}
  .datebar input{border:0;font-weight:600;font-size:13px;padding:4px;background:none;color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:13px;font-weight:700;letter-spacing:.3px;margin-bottom:12px;display:flex;align-items:center;gap:8px} .card h2 small{font-weight:500;color:var(--muted2);font-size:12px}
  /* KPI row */
  .kpis{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:12px;margin-bottom:12px}
  .kpis2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
  .kpi .l{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:14px;color:var(--muted);font-weight:600}
  .kpi .s{font-size:12px;color:var(--muted2);margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi.occ{display:flex;align-items:center;gap:16px}
  .ring{flex:none;width:96px;height:96px} .ring circle{fill:none;stroke-width:10} .ring .bg{stroke:var(--panel2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s}
  .ring text{font:700 22px Outfit,sans-serif;fill:var(--ink)}
  .bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
  /* status legend + forecast */
  .grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:12px}
  .legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .lg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:13px} .lg b{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums}
  .lg i{width:12px;height:12px;border-radius:4px;flex:none}
  .fc{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
  .fc .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:default}
  .fc .c i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px;opacity:.85}
  .fc .c.hi i{background:var(--s-dep)} .fc .c.full i{background:var(--danger)} .fc .c.today i{outline:2px solid var(--ink);outline-offset:1px}
  .fc .c span{font-size:9.5px;color:var(--muted2);margin-top:4px;font-variant-numeric:tabular-nums}
  .fc .c em{font-style:normal;font-size:9.5px;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
  /* room board */
  .floors{display:grid;gap:14px}
  .floor h3{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
  .room{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 8px;background:var(--panel);min-height:84px;display:flex;flex-direction:column;gap:2px}
  .room .no{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums} .room .cat{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room .who{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
  .room .rt{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .room .st{font-size:9.5px;white-space:nowrap;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:6px;color:#fff}
  .room.occupied,.room.turnover{border-color:var(--s-occ);background:#eaf2f6} .room.occupied .st,.room.turnover .st{background:var(--s-occ)}
  .room.arriving{border-color:var(--s-arr)} .room.arriving .st{background:var(--s-arr)}
  .room.departing{border-color:var(--s-dep);background:var(--warn-soft)} .room.departing .st{background:var(--s-dep)}
  .room.dayuse{border-color:var(--s-day)} .room.dayuse .st{background:var(--s-day)}
  .room.ooo{background:repeating-linear-gradient(135deg,var(--panel2) 0 8px,#eceee9 8px 16px);border-color:var(--s-ooo)} .room.ooo .st{background:var(--s-ooo)}
  .room .hk{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--muted)} .room .hk i{width:8px;height:8px;border-radius:50%;background:var(--good)}
  .room .hk.dirty{color:var(--danger)} .room .hk.dirty i{background:var(--danger)} .room .hk.inspected i{background:var(--s-occ)}
  /* lists */
  .lists{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
  .bk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)} .bk:first-of-type{border-top:0}
  .bk .nm{font-weight:600;font-size:14px} .bk .mt{font-size:12px;color:var(--muted)} .bk .grow{flex:1;min-width:0}
  .bk .due{font-size:12px;font-weight:700;color:var(--danger);white-space:nowrap} .bk .ok{font-size:12px;font-weight:600;color:var(--good);white-space:nowrap}
  .bk button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .bk button.ghost{background:var(--panel);color:var(--accent-d)} .bk button:disabled{opacity:.5;cursor:default}
  .empty{font-size:13px;color:var(--muted2);padding:6px 0}
  /* tape chart */
  .tape-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:560px}
  table.tape{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
  .tape th,.tape td{border-bottom:1px solid var(--line);border-right:1px solid #eef0ec;height:34px;padding:0;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  .tape thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:600;color:var(--muted);height:38px;line-height:1.15}
  .tape thead th.today{color:var(--accent-d);box-shadow:inset 0 -2px 0 var(--accent)} .tape thead th.wk{background:#eef0ea}
  .tape th.rm{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:0 10px;min-width:96px;font-weight:700}
  .tape thead th.rm{z-index:3;background:var(--panel2)} .tape th.rm small{display:block;font-weight:500;color:var(--muted2);font-size:10.5px}
  .tape td{position:relative} .tape td.wk{background:#fafbf8}
  .tape .bar-b{position:absolute;top:4px;bottom:4px;left:2px;z-index:1;border-radius:7px;color:#fff;font-size:11.5px;font-weight:600;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:26px;border:0;cursor:pointer}
  .tape .bar-b.in{background:var(--s-occ)} .tape .bar-b.fut{background:var(--accent)} .tape .bar-b.past{background:#a7aba4} .tape .bar-b.day{background:var(--s-day)} .tape .bar-b.hold{background:#c8b9a0;color:#3b3326}
  .tape .bar-b.sel{outline:3px solid var(--ink);outline-offset:1px}
  .tape td.target{background:#e7f3ec;cursor:pointer}
  .tape tr.cat th{background:var(--panel2);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);height:24px}
  .tape-note{font-size:12px;color:var(--muted);margin:8px 2px 0}
  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(20,24,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet .box{background:var(--panel);border-radius:16px 16px 0 0;padding:18px;width:min(520px,100%);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
  @media (min-width:760px){ .sheet{align-items:center} .sheet .box{border-radius:16px} }
  .sheet h3{font-size:16px;margin-bottom:4px} .sheet p{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sheet .acts{display:grid;gap:8px}
  .sheet .acts button,.sheet .acts a{display:block;text-align:center;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:11px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
  .sheet .acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .hk3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:.25s;z-index:60;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)} #toast.err{background:var(--danger)}
  .sk{background:linear-gradient(90deg,#eceee9,#f6f7f4,#eceee9);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px} @keyframes sk{to{background-position:-200% 0}}
  /* folio + night audit */
  .sheet .box.wide{width:min(760px,100%);max-height:92vh;overflow:auto}
  .fo-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px} .fo-hd .grow{flex:1;min-width:0}
  .fo-tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
  .fo-tot div{background:var(--panel2);border-radius:10px;padding:9px 11px;min-width:0} .fo-tot span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .fo-tot b{font-size:18px;font-variant-numeric:tabular-nums} .fo-tot .due b{color:var(--danger)} .fo-tot .wait b{color:var(--warn)}
  .fo-sec{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .fo-sec h4{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 12px;background:var(--panel2)} .fo-sec h4 small{font-weight:500;color:var(--muted)} .fo-sec h4 b{margin-left:auto;font-variant-numeric:tabular-nums}
  .fo-ln{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px} .fo-ln:first-of-type{border-top:0}
  .fo-ln .grow{flex:1;min-width:0} .fo-ln .mt{font-size:11.5px;color:var(--muted2)} .fo-ln .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fo-ln .x{border:0;background:none;color:var(--muted2);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px} .fo-ln .x:hover{background:var(--danger-soft);color:var(--danger)}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:6px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-d)} .pill.wait{background:var(--warn-soft);color:var(--warn)} .pill.no{background:var(--danger-soft);color:var(--danger)}
  .fo-forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .fo-form{border:1px solid var(--line);border-radius:12px;padding:12px} .fo-form h5{font-size:12.5px;margin-bottom:8px}
  .fo-form .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px} .fo-form .row.one{grid-template-columns:1fr}
  .fo-form label{display:block;font-size:11px;font-weight:600;color:var(--muted)} .fo-form input,.fo-form select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;margin-top:2px;background:var(--panel);color:var(--ink);min-width:0}
  .fo-form button{width:100%;border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:9px;font-weight:600;font-size:13px;margin-top:4px}
  .fo-form .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
  .fo-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap} .fo-acts>*{flex:1;text-align:center;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink)}
  .na-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .na-sec{margin-bottom:12px} .na-sec h4{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .na-sec h4 em{font-style:normal;background:var(--panel2);border-radius:6px;padding:1px 7px;color:var(--ink)}
  table.na{width:100%;border-collapse:collapse;font-size:13px} table.na td,table.na th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums} table.na th{font-size:11px;color:var(--muted);font-weight:600}
  table.na td.n,table.na th.n{text-align:right}
  .na-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px} .na-row .grow{flex:1;min-width:0} .na-row .mt{font-size:11.5px;color:var(--muted2)}
  .na-row input{width:18px;height:18px;accent-color:var(--danger)}
  .na-closed{background:var(--accent-soft);color:var(--accent-d);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
  .na-close{width:100%;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px;font-weight:700;font-size:14px;margin-top:4px} .na-close:disabled{opacity:.5}
  @media (max-width:640px){ .fo-tot,.na-grid{grid-template-columns:repeat(2,1fr)} .fo-forms{grid-template-columns:1fr} }
  .cx-st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px} .cx-st i{width:9px;height:9px;border-radius:50%;background:var(--muted2)} .cx-st.on i{background:var(--good)} .cx-st.off{color:var(--muted)}
  .cx-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0} .cx-btns button{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--ink)} .cx-btns button.pri{background:var(--accent);border-color:var(--accent);color:#fff} .cx-btns button:disabled{opacity:.5;cursor:default}
  .cx-sw{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px} .cx-sw .grow{flex:1} .cx-sw input{width:20px;height:20px;accent-color:var(--accent)}
  .cx-url{font:500 12px ui-monospace,monospace;background:var(--panel2);border-radius:8px;padding:8px;word-break:break-all;user-select:all}
  .ok-t{color:var(--good);font-weight:600} .no-t{color:var(--danger);font-weight:600}
  .fo-bill{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px} .fo-bill .grow{flex:1;min-width:0}
  .fo-pr{border:0;background:none;color:var(--accent-d);font-size:11.5px;font-weight:600;padding:2px 4px}
  .co-card{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden} .co-card h4{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--panel2);font-size:14px} .co-card h4 b{margin-left:auto;font-variant-numeric:tabular-nums}
  .print-only{display:none}
  @media print{ .print-skip{display:none!important} .sheet .box.wide{width:100%} body>*:not(.sheet){display:none!important} .sheet{position:absolute;left:0;top:0;right:0;background:none;display:block} .print-only{display:block;font-size:12px;color:var(--muted);margin-bottom:10px} .sheet .box{box-shadow:none;width:100%;max-height:none;overflow:visible;padding:0} .fo-forms,.fo-acts,.fo-ln .x,.noprint{display:none!important} }
  @media (max-width:980px){ .kpis{grid-template-columns:repeat(2,1fr)} .kpi.occ{grid-column:1/-1} .kpis2{grid-template-columns:repeat(2,1fr)} .grid2,.lists{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ttl"><span>Front desk</span><small><span data-prop="name">Hotel</span> · rooms, arrivals and departures</small></div>
    <div class="spacer"></div>
    <div class="datebar" role="group" aria-label="Date">
      <button type="button" id="dPrev" aria-label="Previous day">‹</button>
      <input type="date" id="dDate" aria-label="Date">
      <button type="button" id="dNext" aria-label="Next day">›</button>
      <button type="button" id="dToday">Today</button>
    </div>
    <button type="button" class="tbtn" id="btnCo">Companies</button>
    <button type="button" class="tbtn" id="btnCx">Channels</button>
    <button type="button" class="tbtn" id="btnAudit">Night audit</button>
    <a class="tbtn primary" href="stay.html?new=invoice">+ New booking</a>
  </header>

  <div id="notHotel" class="card" hidden><h2>This property isn't set up as a hotel</h2><p class="empty">Choose Hotel in Settings → Rooms and add your room categories and rooms to use the front desk.</p></div>

  <div id="main">
    <div class="kpis"><div class="sk" style="height:126px"></div><div class="sk" style="height:126px"></div><div class="sk" style="height:126px"></div><div class="sk" style="height:126px"></div><div class="sk" style="height:126px"></div></div>
    <div class="sk" style="height:300px"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const PROXY_URL = 'https://data.ryst.in';
const TOKEN = localStorage.getItem('ryst_proxy_token') || '';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const todayIST = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
const addD = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dLbl = (d, o) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', Object.assign({ timeZone: 'UTC' }, o || { day: 'numeric', month: 'short' }));
function toast(msg, err){ const el = $('#toast'); el.textContent = msg; el.className = err ? 'show err' : 'show'; clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3000); }
async function api(path, body){
  if (!TOKEN) { location.href = 'login.html'; throw new Error('Signed out'); }
  const res = await fetch(PROXY_URL + path, body ? { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { headers: { 'X-Token': TOKEN }, cache: 'no-store' });
  if (res.status === 401) { localStorage.removeItem('ryst_proxy_token'); location.href = 'login.html'; throw new Error('Signed out'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.error || 'Something went wrong'); e.status = res.status; throw e; }
  return j;
}

const STATE = { occupied: 'In house', turnover: 'Turnover', arriving: 'Arriving', departing: 'Departing', dayuse: 'Day use', vacant: '', ooo: 'Out of order' };
const HKN = { clean: 'Clean', dirty: 'Dirty', inspected: 'Inspected' };
let date = new URLSearchParams(location.search).get('date') || todayIST(), D = null, moving = null;
$('#dDate').value = date;
$('#dDate').addEventListener('change', () => { date = $('#dDate').value || todayIST(); load(); });
$('#dPrev').addEventListener('click', () => { date = addD(date, -1); $('#dDate').value = date; load(); });
$('#dNext').addEventListener('click', () => { date = addD(date, 1); $('#dDate').value = date; load(); });
$('#dToday').addEventListener('click', () => { date = todayIST(); $('#dDate').value = date; load(); });

async function load(){
  try { D = await api('/hotel/frontdesk?date=' + date); render(); }
  catch (e) { if (e.status === 404) { $('#notHotel').hidden = false; $('#main').hidden = true; } else toast(e.message, true); }
}
const catName = id => ((D.categories || []).find(c => c.id === id) || {}).name || id;

function ring(p){ const r = 40, c = 2 * Math.PI * r, f = Math.max(0, Math.min(100, p)) / 100 * c;
  return `<svg class="ring" viewBox="0 0 96 96" aria-hidden="true"><circle class="bg" cx="48" cy="48" r="${r}"/><circle class="fg" cx="48" cy="48" r="${r}" stroke-dasharray="${f} ${c}" transform="rotate(-90 48 48)"/><text x="48" y="55" text-anchor="middle">${p}%</text></svg>`; }

function render(){
  const k = D.kpis, isToday = date === todayIST();
  const arrIn = D.arrivals.filter(s => s.checkedInAt).reduce((a, s) => a + s.rooms.length, 0), depOut = D.departures.filter(s => s.checkedOutAt).reduce((a, s) => a + s.rooms.length, 0);
  const lg = [['Vacant clean', k.status.vacantClean, 'var(--s-clean)', 'var(--good)'], ['Inspected', k.status.vacantInspected, 'var(--s-insp)', 'var(--s-occ)'], ['Vacant dirty', k.status.vacantDirty, 'var(--s-dirty)', 'var(--danger)'],
    ['In house', k.status.occupied, 'var(--s-occ)'], ['Arriving', k.status.arriving, 'var(--s-arr)'], ['Departing', k.status.departing, 'var(--s-dep)'], ['Day use', k.status.dayuse, 'var(--s-day)'], ['Out of order', k.status.ooo, 'var(--s-ooo)']];
  const days = D.days, max = 100;
  $('#main').innerHTML = `
  <div class="kpis">
    <div class="kpi occ">${ring(k.occupancy)}<div><div class="l">${isToday ? 'Occupancy tonight' : 'Occupancy ' + dLbl(date)}</div><div class="v">${k.sold}<small> / ${k.sellable} rooms</small></div><div class="s">Month so far ${k.occupancyMTD}%</div></div></div>
    <div class="kpi"><div class="l">Arrivals</div><div class="v">${k.arrivals}</div><div class="s">${arrIn} checked in</div><div class="bar"><i style="width:${k.arrivals ? arrIn / k.arrivals * 100 : 0}%"></i></div></div>
    <div class="kpi"><div class="l">Departures</div><div class="v">${k.departures}</div><div class="s">${depOut} checked out</div><div class="bar"><i style="width:${k.departures ? depOut / k.departures * 100 : 0}%;background:var(--s-dep)"></i></div></div>
    <div class="kpi"><div class="l">In house</div><div class="v">${k.inHouse}</div><div class="s">${k.dayUse ? k.dayUse + ' day-use room' + (k.dayUse === 1 ? '' : 's') : 'rooms occupied'}</div></div>
    <div class="kpi"><div class="l">Rooms ready</div><div class="v">${k.roomsReady}</div><div class="s">${k.roomsDirty} to clean</div><div class="bar"><i style="width:${(k.roomsReady + k.roomsDirty) ? k.roomsReady / (k.roomsReady + k.roomsDirty) * 100 : 100}%"></i></div></div>
  </div>
  <div class="kpis2">
    <div class="kpi"><div class="l">Room revenue ${isToday ? 'tonight' : dLbl(date)}</div><div class="v">${inr(k.revenueToday)}</div><div class="s">GST included</div></div>
    <div class="kpi"><div class="l">ADR</div><div class="v">${inr(k.adr)}</div><div class="s">Month ${inr(k.adrMTD)} · revenue per room sold</div></div>
    <div class="kpi"><div class="l">RevPAR</div><div class="v">${inr(k.revpar)}</div><div class="s">Month ${inr(k.revparMTD)} · revenue per available room</div></div>
    <div class="kpi"><div class="l">Revenue this month</div><div class="v">${inr(k.revenueMTD)}</div><div class="s">to ${dLbl(date)}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Room status</h2><div class="legend">${lg.map(x => `<div class="lg"><i style="background:${x[2]};${x[3] ? 'box-shadow:inset 0 0 0 2px ' + x[3] : ''}"></i>${x[0]}<b>${x[1]}</b></div>`).join('')}</div></div>
    <div class="card"><h2>Occupancy, next 30 days <small>bookings on the books</small></h2>
      <div class="fc">${days.map((d, i) => `<div class="c${d.occupancy >= 90 ? ' full' : d.occupancy >= 70 ? ' hi' : ''}${i === 0 ? ' today' : ''}" title="${dLbl(d.date, { weekday: 'short', day: 'numeric', month: 'short' })}: ${d.sold}/${d.sellable} rooms, ${d.occupancy}%">${i % 2 === 0 ? `<em>${d.occupancy}</em>` : '<em>&nbsp;</em>'}<i style="height:${Math.max(2, d.occupancy / max * 100)}%"></i><span>${i % 3 === 0 ? dLbl(d.date, { day: 'numeric' }) : '&nbsp;'}</span></div>`).join('')}</div>
    </div>
  </div>
  <div class="card"><h2>Rooms <small>tap a room for check-in, check-out or housekeeping</small></h2><div class="floors" id="board"></div></div>
  <div class="lists">
    <div class="card"><h2>Arrivals <small>${dLbl(date)}</small></h2><div id="lArr"></div></div>
    <div class="card"><h2>Departures <small>${dLbl(date)}</small></h2><div id="lDep"></div></div>
    <div class="card"><h2>In house</h2><div id="lIn"></div></div>
    <div class="card"><h2>Day use</h2><div id="lDay"></div></div>
  </div>
  <div class="card"><h2>Tape chart <small>tap a booking to move it to another room</small></h2><div class="tape-wrap" id="tape"></div><p class="tape-note" id="tapeNote"></p></div>`;
  renderBoard(); renderLists(); renderTape();
}

function renderBoard(){
  const floors = {}; D.rooms.forEach(r => { (floors[r.floor || '—'] = floors[r.floor || '—'] || []).push(r); });
  $('#board').innerHTML = Object.keys(floors).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(f => `<div class="floor"><h3>${f === '—' ? 'Rooms' : 'Floor ' + esc(f)}</h3><div class="rooms">${floors[f].map(r => `
    <button type="button" class="room ${r.state}" data-room="${esc(r.no)}">
      <span class="rt"><span class="no">${esc(r.no)}</span>${STATE[r.state] ? `<span class="st">${STATE[r.state]}</span>` : ''}</span><span class="cat">${esc(catName(r.cat))}</span>
      ${r.state === 'ooo' ? `<span class="who">${esc(r.reason || 'Out of order')}</span>` : r.guest ? `<span class="who">${esc(r.guest)}</span>` : ''}
      <span class="hk ${r.hk}"><i></i>${HKN[r.hk]}</span></button>`).join('')}</div></div>`).join('');
  $('#board').onclick = e => { const b = e.target.closest('[data-room]'); if (b) roomSheet(D.rooms.find(r => r.no === b.dataset.room)); };
}
const allStays = () => D.tape.stays;
function bkRow(s, kind){
  const due = Math.max(0, s.total - s.paid), roomsTxt = s.rooms.map(r => r.roomNo ? r.roomNo : catName(r.cat) + ' (no room yet)').join(', ');
  let btn = '';
  if (kind === 'arr') btn = s.checkedInAt ? '<span class="ok">Checked in</span>' : `<button type="button" data-act="checkin" data-no="${esc(s.no)}">Check in</button>`;
  if (kind === 'dep') btn = s.checkedOutAt ? '<span class="ok">Checked out</span>' : `<button type="button" data-act="checkout" data-no="${esc(s.no)}">Check out</button>`;
  if (kind === 'day') btn = s.checkedOutAt ? '<span class="ok">Done</span>' : s.checkedInAt ? `<button type="button" data-act="checkout" data-no="${esc(s.no)}">Check out</button>` : `<button type="button" data-act="checkin" data-no="${esc(s.no)}">Check in</button>`;
  const when = s.dayUse ? `${s.dayUse.start} · ${s.dayUse.hours} h` : `${dLbl(s.checkin)} → ${dLbl(s.checkout)}`;
  return `<div class="bk"><div class="grow"><a class="nm" href="stay.html?open=${encodeURIComponent(s.no)}">${esc(s.guest || s.no)}</a><div class="mt">${esc(roomsTxt)} · ${when}${s.channel ? ' · ' + esc(s.channel) : ''}${s.checkinDone ? ' · online check-in done' : ''}</div></div>
    ${due > 0 ? `<span class="due">${inr(due)} due</span>` : '<span class="ok">Paid</span>'}<button type="button" class="ghost" data-folio="${esc(s.no)}">Folio</button>${btn}</div>`;
}
function renderLists(){
  const put = (id, list, kind, none) => { $(id).innerHTML = list.length ? list.map(s => bkRow(s, kind)).join('') : `<p class="empty">${none}</p>`; };
  put('#lArr', D.arrivals, 'arr', 'No arrivals.'); put('#lDep', D.departures, 'dep', 'No departures.'); put('#lIn', D.inHouse, 'in', 'Nobody staying over.'); put('#lDay', D.dayUse, 'day', 'No day-use bookings.');
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act, b.dataset.no, b)));
  document.querySelectorAll('.lists [data-folio]').forEach(b => b.addEventListener('click', () => folioSheet(b.dataset.folio)));
}
async function act(kind, no, btn){
  if (kind === 'checkout') { const s = allStays().find(x => x.no === no) || {}, due = Math.max(0, (s.total || 0) - (s.paid || 0)); if (due > 0 && !confirm(`${s.guest || no} still owes ${inr(due)}. Check out anyway?`)) return; }
  if (btn) btn.disabled = true;
  try { await api('/hotel/' + kind, { no }); toast(kind === 'checkin' ? 'Checked in' : 'Checked out — rooms marked dirty'); await load(); }
  catch (e) { toast(e.message, true); if (btn) btn.disabled = false; }
}
function sheet(html){ const el = document.createElement('div'); el.className = 'sheet'; el.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`; el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) el.remove(); }); document.body.appendChild(el); return el; }
function roomSheet(r){
  const s = r.stay ? allStays().find(x => x.no === r.stay) : null, leaving = r.leaving ? allStays().find(x => x.no === r.leaving) : null;
  const acts = [];
  if (leaving && !leaving.checkedOutAt) acts.push(`<button class="pri" data-a="checkout" data-n="${esc(leaving.no)}">Check out ${esc(leaving.guest)}</button>`);
  if (s && !s.checkedInAt && (r.state === 'arriving' || r.state === 'dayuse')) acts.push(`<button class="pri" data-a="checkin" data-n="${esc(s.no)}">Check in ${esc(s.guest)}</button>`);
  if (s && r.state === 'departing' && !s.checkedOutAt) acts.push(`<button class="pri" data-a="checkout" data-n="${esc(s.no)}">Check out ${esc(s.guest)}</button>`);
  if (s) acts.push(`<button data-fo="${esc(s.no)}">Folio · charges and payments</button>`, `<a href="stay.html?open=${encodeURIComponent(s.no)}">Open booking</a>`);
  const el = sheet(`<h3>Room ${esc(r.no)} · ${esc(catName(r.cat))}</h3><p>${STATE[r.state] || 'Vacant'}${s ? ' · ' + esc(s.guest) : ''} · Housekeeping: ${HKN[r.hk]}</p>
    <div class="acts">${acts.join('')}<div class="hk3">${['clean', 'dirty', 'inspected'].map(h => `<button data-hk="${h}"${h === r.hk ? ' disabled' : ''}>${HKN[h]}</button>`).join('')}</div><button data-close>Close</button></div>`);
  el.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { el.remove(); act(b.dataset.a, b.dataset.n); }));
  el.querySelectorAll('[data-fo]').forEach(b => b.addEventListener('click', () => { el.remove(); folioSheet(b.dataset.fo); }));
  el.querySelectorAll('[data-hk]').forEach(b => b.addEventListener('click', async () => { try { await api('/hotel/room-status', { room: r.no, hk: b.dataset.hk }); el.remove(); toast(`Room ${r.no}: ${HKN[b.dataset.hk]}`); load(); } catch (e) { toast(e.message, true); } }));
}

// ── Folio: the bill room by room, extras posted at the desk, payments (staff ones wait for the owner) ──
const METHODS = ['Cash', 'UPI', 'Card', 'Bank transfer'];
async function folioSheet(no){
  let F; try { F = await api('/hotel/folio?no=' + encodeURIComponent(no)); } catch (e) { toast(e.message, true); return; }
  const el = sheet('<div class="fo-body"></div>'); el.querySelector('.box').classList.add('wide');
  const draw = () => {
    const recent = l => F.canApprove || (Date.now() - (l.at || 0) < 15 * 60 * 1000);
    const line = l => `<div class="fo-ln"><div class="grow"><div>${esc(l.desc)}${l.qty > 1 ? ` <span class="mt">× ${l.qty}</span>` : ''}</div><div class="mt">${l.kind === 'room' ? 'Room charge' : esc(F.kinds[l.kind] || l.kind)}${l.date ? ' · ' + dLbl(l.date) : ''}${l.by ? ' · ' + esc(l.by) : ''}${l.gstRate != null ? ' · GST ' + l.gstRate + '%' : ''}</div></div>
      <span class="am">${inr(l.amount)}</span>${l.kind !== 'room' && l.id && !F.invoiced && recent(l) ? `<button type="button" class="x" data-void="${esc(l.id)}" aria-label="Remove ${esc(l.desc)}" title="Remove">×</button>` : ''}</div>`;
    const secs = F.byRoom.map(r => ({ room: r.roomNo, title: r.roomNo ? 'Room ' + r.roomNo : 'Room (no number yet)', sub: catName(r.cat), lines: F.lines.filter(l => r.roomNo && l.room === r.roomNo), total: r.charges, paid: r.paid }));
    const shared = F.lines.filter(l => !l.room); if (shared.length) secs.push({ title: 'Booking', sub: 'not tied to one room', lines: shared, total: F.shared });
    const pays = F.payments.map(p => `<div class="fo-ln"><div class="grow"><div>${esc(p.method)}${p.company ? ' · ' + esc(p.company) + (p.settled ? ' (paid by the company)' : ' (owed by the company)') : ''}${p.room ? ' · Room ' + esc(p.room) : ''}</div><div class="mt">${p.date ? dLbl(p.date) : ''}${p.by ? ' · ' + esc(p.by) : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
      ${p.status === 'pending' ? '<span class="pill wait">Awaiting approval</span>' : p.status === 'rejected' ? '<span class="pill no">Rejected</span>' : '<span class="pill">Received</span>'}<span class="am">${inr(p.amount)}</span></div>`).join('');
    const roomOpts = `<option value="">Whole booking</option>` + F.byRoom.filter(r => r.roomNo).map(r => `<option value="${esc(r.roomNo)}">Room ${esc(r.roomNo)}</option>`).join('');
    const closed = F.invoiced ? 'The tax invoice is issued, so the bill is closed. Cancel the invoice on the booking to change charges.' : F.checkedOutAt ? 'Checked out: charges are closed. Payments can still be recorded.' : '';
    el.querySelector('.fo-body').innerHTML = `
      <div class="print-only"><b style="font-size:15px;color:var(--ink)">${esc((document.querySelector('[data-prop="name"]') || {}).textContent || '')}</b><br>Guest folio · printed ${new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })} · not a tax invoice</div>
      <div class="fo-hd"><div class="grow"><h3>Folio · ${esc(F.guest || F.no)}</h3><p style="margin:0">${esc(F.no)} · ${dLbl(F.checkin)} → ${dLbl(F.checkout)} · ${F.rooms.length} room${F.rooms.length === 1 ? '' : 's'}</p></div><button type="button" class="tbtn noprint" data-close>Close</button></div>
      <div class="fo-bill">${F.billTo ? `<div class="grow"><span class="mt">Billed to</span> <b>${esc(F.billTo.name)}</b>${F.billTo.gstin ? ` · GSTIN ${esc(F.billTo.gstin)}` : ''}${F.billTo.address ? `<div class="mt">${esc(F.billTo.address)}</div>` : ''}</div><button type="button" class="tbtn noprint" id="foBillEdit">Change</button>`
        : `<div class="grow mt">Billed to the guest.</div><button type="button" class="tbtn noprint" id="foBillEdit">Bill to a company</button>`}</div>
      <div class="fo-tot"><div><span>Bill</span><b>${inr(F.total)}</b></div><div><span>Received</span><b>${inr(F.paid)}</b></div><div class="wait"><span>Awaiting approval</span><b>${inr(F.pending)}</b></div><div class="${F.balance > 0 ? 'due' : ''}"><span>Balance</span><b>${inr(Math.max(0, F.balance))}</b></div></div>
      ${secs.map(x => `<div class="fo-sec" data-sec="${esc(x.room || '')}"><h4>${esc(x.title)} <small>${esc(x.sub)}</small>${x.room && F.byRoom.length > 1 ? `<button type="button" class="fo-pr noprint" data-print-room="${esc(x.room)}">Print this room</button>` : ''}<b>${inr(x.total)}</b></h4>${x.lines.length ? x.lines.map(line).join('') : '<div class="fo-ln"><span class="mt">No charges on this room yet</span></div>'}${x.paid ? `<div class="fo-ln"><div class="grow mt">Paid against this room</div><span class="am">− ${inr(x.paid)}</span></div>` : ''}</div>`).join('')}
      ${F.discount ? `<div class="fo-sec"><div class="fo-ln"><div class="grow">Discount</div><span class="am">− ${inr(F.discount)}</span></div></div>` : ''}
      <div class="fo-sec" data-sec="pay"><h4>Payments <small>${F.pending ? 'staff payments count once the owner approves them' : ''}</small><b>${inr(F.paid)}</b></h4>${pays || '<div class="fo-ln"><span class="mt">No payments recorded here yet</span></div>'}</div>
      ${closed ? `<p class="noprint" style="margin:6px 0 0">${closed}</p>` : ''}
      <div class="fo-forms">
        ${F.invoiced || F.checkedOutAt ? '' : `<form class="fo-form" id="foChg"><h5>Add a charge</h5>
          <div class="row"><label>For<select name="kind">${Object.keys(F.kinds).map(k => `<option value="${k}">${esc(F.kinds[k])}</option>`).join('')}</select></label><label>Room<select name="room">${roomOpts}</select></label></div>
          <div class="row one"><label>Description (optional)<input name="desc" maxlength="80" placeholder="e.g. 2 soft drinks"></label></div>
          <div class="row"><label>Amount each, GST incl.<input name="amount" type="number" min="1" step="0.01" inputmode="decimal" required></label><label>Qty<input name="qty" type="number" min="1" max="99" value="1"></label></div>
          <div class="row one"><label>GST rate<select name="gst"><option value="18">18%</option><option value="5">5%</option><option value="12">12%</option><option value="0">Nil</option></select></label></div>
          <button type="submit">Add to bill</button></form>`}
        <form class="fo-form" id="foPay"><h5>Record a payment</h5>
          <div class="row"><label>Amount<input name="amount" type="number" min="1" step="1" inputmode="numeric" required value="${F.balance - F.pending > 0 ? Math.round(F.balance - F.pending) : ''}"></label><label>How<select name="method">${METHODS.concat(F.billTo ? ['Company account'] : []).map(m => `<option${m === 'Company account' ? ` value="${m}">To ${esc(F.billTo.name)}’s account` : `>${m}`}</option>`).join('')}</select></label></div>
          <div class="row one"><label>Against<select name="room">${roomOpts}</select></label></div>
          <button type="submit">Record payment</button>
          <p class="hint">${F.canApprove ? 'Counted as received straight away.' : 'It waits for the owner’s approval before it counts as received.'}</p></form>
      </div>
      <div class="fo-acts noprint"><button type="button" id="foPrint">Print folio</button><a href="stay.html?open=${encodeURIComponent(F.no)}">Open booking</a></div>`;
    const reload = async msg => { try { F = await api('/hotel/folio?no=' + encodeURIComponent(no)); draw(); if (msg) toast(msg); load(); } catch (e) { toast(e.message, true); } };
    const chg = el.querySelector('#foChg');
    if (chg) chg.addEventListener('submit', async e => { e.preventDefault(); const f = new FormData(chg), b = chg.querySelector('button'); b.disabled = true;
      try { await api('/hotel/charge', { no, kind: f.get('kind'), room: f.get('room'), desc: f.get('desc'), amount: f.get('amount'), qty: f.get('qty'), gst: f.get('gst') }); reload('Charge added'); } catch (err) { toast(err.message, true); b.disabled = false; } });
    const pay = el.querySelector('#foPay');
    pay.addEventListener('submit', async e => { e.preventDefault(); const f = new FormData(pay), b = pay.querySelector('button'); b.disabled = true;
      try { const r = await api('/hotel/pay', { no, amount: f.get('amount'), method: f.get('method'), room: f.get('room') }); reload(r.status === 'pending' ? 'Payment recorded — waiting for the owner’s approval' : 'Payment received'); } catch (err) { toast(err.message, true); b.disabled = false; } });
    el.querySelectorAll('[data-void]').forEach(b => b.addEventListener('click', async () => { if (!confirm('Remove this charge from the bill?')) return;
      try { await api('/hotel/charge-void', { no, id: b.dataset.void }); reload('Charge removed'); } catch (err) { toast(err.message, true); } }));
    el.querySelector('#foPrint').addEventListener('click', () => window.print());
    // one room's bill on its own (a guest paying for their own room)
    el.querySelectorAll('[data-print-room]').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('.fo-sec[data-sec]').forEach(x => x.classList.toggle('print-skip', x.dataset.sec !== b.dataset.printRoom)); el.querySelector('.fo-tot').classList.add('print-skip');
      window.print(); setTimeout(() => el.querySelectorAll('.print-skip').forEach(x => x.classList.remove('print-skip')), 500);
    }));
    el.querySelector('#foBillEdit').addEventListener('click', () => {
      const bt = F.billTo || {}, box = sheet(`<h3>Bill to a company</h3><p>The company is shown on the folio and the tax invoice, and the balance can be moved to its account.</p>
        <form class="fo-form" id="btF" style="border:0;padding:0"><div class="row one"><label>Company name<input name="name" maxlength="120" required value="${esc(bt.name || '')}"></label></div>
        <div class="row"><label>GSTIN (optional)<input name="gstin" maxlength="15" value="${esc(bt.gstin || '')}" style="text-transform:uppercase"></label><label>Address (optional)<input name="address" maxlength="300" value="${esc(bt.address || '')}"></label></div>
        <button type="submit">Save</button>${F.billTo ? '<button type="button" id="btClear" style="background:var(--panel);color:var(--ink);border-color:var(--line)">Bill the guest instead</button>' : ''}</form>`);
      box.querySelector('#btF').addEventListener('submit', async e => { e.preventDefault(); const f = new FormData(e.target);
        try { await api('/hotel/bill-to', { no, name: f.get('name'), gstin: f.get('gstin'), address: f.get('address') }); box.remove(); reload('Billing company saved'); } catch (err) { toast(err.message, true); } });
      const c = box.querySelector('#btClear'); if (c) c.addEventListener('click', async () => { try { await api('/hotel/bill-to', { no, clear: true }); box.remove(); reload('Billed to the guest'); } catch (err) { toast(err.message, true); } });
    });
  };
  draw();
}

// ── Company accounts (city ledger): what each company owes, and recording its payment ──
$('#btnCo').addEventListener('click', () => coSheet());
async function coSheet(){
  let C; try { C = await api('/hotel/companies'); } catch (e) { toast(e.message, true); return; }
  const el = sheet('<div class="co-body"></div>'); el.querySelector('.box').classList.add('wide');
  const draw = () => {
    el.querySelector('.co-body').innerHTML = `<div class="fo-hd"><div class="grow"><h3>Company accounts</h3><p style="margin:0">Balances moved from a folio to the company it's billed to. ${inr(C.outstanding)} owed in all.</p></div><button type="button" class="tbtn" data-close>Close</button></div>
      ${C.companies.length ? C.companies.map((c, ci) => `<div class="co-card"><h4>${esc(c.name)}${c.gstin ? ` <small style="font-weight:500;color:var(--muted)">${esc(c.gstin)}</small>` : ''}<b>${inr(c.outstanding)} owed</b></h4>
        ${c.entries.map(x => `<label class="fo-ln">${C.canSettle && x.status === 'approved' && !x.settled ? `<input type="checkbox" data-co="${ci}" value="${esc(x.id)}" data-amt="${x.amount}" style="width:18px;height:18px;accent-color:var(--accent)">` : ''}<div class="grow"><div>${esc(x.guest || x.no)} <span class="mt">${esc(x.no)}</span></div><div class="mt">${dLbl(x.checkin)} → ${dLbl(x.checkout)}${x.date ? ' · moved ' + dLbl(x.date) : ''}</div></div>
          ${x.status === 'pending' ? '<span class="pill wait">Awaiting approval</span>' : x.settled ? `<span class="pill">Paid · ${esc(x.settled.method)}${x.settled.ref ? ' ' + esc(x.settled.ref) : ''}</span>` : '<span class="pill no">Owed</span>'}<span class="am">${inr(x.amount)}</span></label>`).join('')}
        ${C.canSettle && c.outstanding ? `<form class="fo-form co-pay" data-ci="${ci}" style="border:0;border-top:1px solid var(--line);border-radius:0"><div class="row"><label>Paid by<select name="method">${['Bank transfer', 'UPI', 'Cheque', 'Card', 'Cash'].map(m => `<option>${m}</option>`).join('')}</select></label><label>Reference<input name="ref" maxlength="60" placeholder="UTR / cheque no."></label></div><button type="submit">Record payment for the ticked bookings</button></form>` : ''}</div>`).join('')
        : '<p class="empty">No company accounts yet. On a folio, choose “Bill to a company”, then record the balance “To the company’s account”.</p>'}
      ${C.canSettle ? '' : '<p class="empty">Only the owner records payments from companies.</p>'}`;
    el.querySelectorAll('.co-pay').forEach(f => f.addEventListener('submit', async e => { e.preventDefault();
      const ids = [...el.querySelectorAll(`[data-co="${f.dataset.ci}"]:checked`)].map(x => x.value), fd = new FormData(f);
      if (!ids.length) { toast('Tick the bookings this payment covers', true); return; }
      try { const r = await api('/hotel/company-settle', { ids, method: fd.get('method'), ref: fd.get('ref') }); C = await api('/hotel/companies'); draw(); toast(`${inr(r.amount)} recorded from the company`); } catch (err) { toast(err.message, true); } }));
  };
  draw();
}

// ── Channel manager (Channex): status, set up, send changes, pull OTA bookings ──
$('#btnCx').addEventListener('click', () => cxSheet());
async function cxSheet(){
  let C; try { C = await api('/channex/status'); } catch (e) { toast(e.message, true); return; }
  const el = sheet('<div class="cx-body"></div>'); el.querySelector('.box').classList.add('wide');
  const when = t => t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
  const draw = () => {
    const m = C.mapping, mapped = !!m.propertyId, own = C.canChange;
    const rows = C.categories.map(c => { const rt = m.roomTypes.find(x => x.cat === c.id); return `<tr><td>${esc(c.name)} <span class="mt" style="color:var(--muted2)">${c.rooms} room${c.rooms === 1 ? '' : 's'}</span></td><td>${rt ? '<span class="ok-t">Linked</span>' : '<span class="no-t">Not linked</span>'}</td><td>${c.plans.map(p => m.ratePlans.some(x => x.cat === c.id && x.plan === p) ? `<span class="pill">${p}</span>` : `<span class="pill no">${p}</span>`).join(' ')}</td></tr>`; }).join('');
    const missing = C.categories.some(c => !m.roomTypes.some(x => x.cat === c.id) || c.plans.some(p => !m.ratePlans.some(x => x.cat === c.id && x.plan === p)));
    const lp = C.lastPush, pl = C.lastPull, fullOk = !C.lastFullAt || Date.now() - C.lastFullAt > 24 * 3600e3;
    el.querySelector('.cx-body').innerHTML = `
      <div class="fo-hd"><div class="grow"><h3>Channel manager · Channex</h3><p style="margin:0">Rooms and rates go to your OTAs through Channex; their bookings come back here.</p></div><button type="button" class="tbtn" data-close>Close</button></div>
      <div class="cx-st ${C.configured ? 'on' : 'off'}"><i></i>${C.configured ? `Connected${C.ownKey ? ' with the hotel’s own Channex account' : ' through Harbour'} · ${C.env === 'production' ? 'live' : 'staging (test)'}` : 'Not connected. An admin adds the Channex key in Settings → Connections, or Harbour enables its partner account for you.'}</div>
      ${C.configured ? `
      <div class="na-sec"><h4>Room types and rate plans</h4><table class="na"><tr><th>Category</th><th>Room type</th><th>Meal plans</th></tr>${rows}</table>
        ${missing && own ? `<div class="cx-btns"><button type="button" class="pri" id="cxSetup">${mapped ? 'Add the missing ones at Channex' : 'Set up at Channex'}</button></div><p class="empty">${mapped ? 'Creates the missing room types and rate plans' : 'Creates the property, a room type per category and a rate plan per meal plan'} in your Channex account. Then connect each OTA to them inside Channex.</p>` : ''}</div>
      ${mapped ? `
      <label class="cx-sw"><div class="grow"><b>Live sync</b><br><span class="mt" style="color:var(--muted)">Send changes automatically when bookings change, and read OTA bookings on a schedule (at once when the webhook below is set in Channex).</span></div><input type="checkbox" id="cxLive" ${C.live ? 'checked' : ''} ${own ? '' : 'disabled'} aria-label="Live sync"></label>
      <div class="na-sec"><h4>Updates</h4>
        <p style="margin:0 0 6px;font-size:13px;color:var(--ink)">${C.unsent && (C.unsent.availability || C.unsent.rates) ? 'Not sent yet: ' + [C.unsent.availability ? `availability on ${C.unsent.availability} day${C.unsent.availability === 1 ? '' : 's'}` : '', C.unsent.rates ? `rates on ${C.unsent.rates} day${C.unsent.rates === 1 ? '' : 's'}` : ''].filter(Boolean).join(' and ') + '.' : 'Channex has everything Harbour knows.'}</p>
        ${lp ? `<p class="empty">Last sent ${when(lp.at)}: ${lp.ok ? `<span class="ok-t">accepted by Channex</span> (${lp.availability} availability, ${lp.restrictions} rate ranges${lp.full ? ', full' : ''})` : `<span class="no-t">failed: ${esc(lp.error)}</span>`}${lp.warnings && lp.warnings.length ? ` · ${lp.warnings.length} warning${lp.warnings.length === 1 ? '' : 's'}` : ''}. Channex then applies it to each channel.</p>` : '<p class="empty">Nothing sent yet.</p>'}
        ${own ? `<div class="cx-btns"><button type="button" id="cxPrev">Preview</button><button type="button" class="pri" id="cxSend">Send changes now</button><button type="button" id="cxFull" ${fullOk ? '' : 'disabled title="Once a day"'}>Full sync</button></div>` : ''}
        <div id="cxOut"></div></div>
      <div class="na-sec"><h4>OTA bookings</h4>
        <p class="empty">${pl ? `Last read ${when(pl.at)}: ${pl.error ? `<span class="no-t">${esc(pl.error)}</span>` : `${pl.imported || 0} new or changed`}` : 'Not read yet.'}</p>
        <div class="cx-btns"><button type="button" id="cxPull">Get bookings now</button></div></div>
      ${own ? `<div class="na-sec"><h4>Webhook for Channex</h4><p class="empty">Paste this in Channex → Webhooks (event: bookings) so new OTA bookings arrive within seconds.</p><div class="cx-url">${esc(C.webhookUrl)}</div></div>` : ''}` : ''}
      ${C.log.length ? `<div class="na-sec"><h4>Activity</h4>${C.log.map(l => `<div class="na-row"><div class="grow">${esc(l.what)}<div class="mt">${when(l.at)}${l.by ? ' · ' + esc(String(l.by).split('@')[0]) : ''}</div></div></div>`).join('')}</div>` : ''}` : ''}`;
    const reload = async msg => { try { C = await api('/channex/status'); draw(); if (msg) toast(msg); } catch (e) { toast(e.message, true); } };
    const run = (id, fn) => { const b = el.querySelector(id); if (b) b.addEventListener('click', async () => { b.disabled = true; try { await fn(b); } catch (e) { toast(e.message, true); b.disabled = false; } }); };
    run('#cxSetup', async () => { const r = await api('/channex/setup', {}); reload(`Linked ${r.mapping.roomTypes.length} room types and ${r.mapping.ratePlans.length} rate plans`); });
    run('#cxPrev', async b => { const r = await api('/channex/preview'); el.querySelector('#cxOut').innerHTML = `<p class="empty">Would send ${r.availability} availability range${r.availability === 1 ? '' : 's'} and ${r.restrictions} rate range${r.restrictions === 1 ? '' : 's'}. Nothing was sent.</p>`; b.disabled = false; });
    run('#cxSend', async () => { const r = await api('/channex/sync', {}); reload(r.sent ? 'Sent — Channex accepted the update' : 'Nothing to send'); });
    run('#cxFull', async () => { if (!confirm('Send every date for the next 500 days? Channex allows this once a day.')) throw new Error('Not sent'); const r = await api('/channex/sync', { full: true }); reload(r.sent ? 'Full sync accepted by Channex' : 'Nothing to send'); });
    run('#cxPull', async () => { const r = await api('/channex/pull', {}); reload(r.imported ? `${r.imported} booking${r.imported === 1 ? '' : 's'} from Channex` : 'No new OTA bookings'); if (r.imported) load(); });
    const live = el.querySelector('#cxLive');
    if (live) live.addEventListener('change', async () => { try { const r = await fetch(PROXY_URL + '/channex/settings', { method: 'PUT', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ live: live.checked }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error); reload(j.live ? 'Live sync on' : 'Live sync off'); } catch (e) { live.checked = !live.checked; toast(e.message, true); } });
  };
  draw();
}

// ── Night audit: check the day, mark no-shows, close it (once) ──
$('#btnAudit').addEventListener('click', () => auditSheet(date > todayIST() ? todayIST() : date));
async function auditSheet(day){
  let A; try { A = await api('/hotel/audit?date=' + day); } catch (e) { toast(e.message, true); return; }
  const el = sheet('<div class="na-body"></div>'); el.querySelector('.box').classList.add('wide');
  const k = A.kpis, people = (list, none, mark) => list.length ? list.map(x => `<label class="na-row">${mark ? `<input type="checkbox" value="${esc(x.no)}" data-ns>` : ''}<div class="grow"><div>${esc(x.guest || x.no)}</div><div class="mt">${esc(x.no)} · ${x.rooms.length ? 'Room ' + x.rooms.map(esc).join(', ') : x.roomCount + ' room' + (x.roomCount === 1 ? '' : 's') + ', no number yet'} · ${dLbl(x.checkin)} → ${dLbl(x.checkout)}</div></div>${x.balance > 0 ? `<span class="due" style="color:var(--danger);font-weight:700;font-size:12px">${inr(x.balance)} due</span>` : '<span class="pill">Paid</span>'}</label>`).join('') : `<p class="empty">${none}</p>`;
  const methods = Object.keys(A.payments);
  el.querySelector('.na-body').innerHTML = `
    <div class="fo-hd"><div class="grow"><h3>Night audit · ${dLbl(A.date, { weekday: 'short', day: 'numeric', month: 'short' })}</h3><p style="margin:0">Check the day, mark guests who never arrived, then close it. A day closes once.</p></div>
      <input type="date" id="naDate" max="${A.today}" value="${A.date}" aria-label="Day" style="border:1.5px solid var(--line);border-radius:8px;padding:6px;font:600 13px Outfit,sans-serif"><button type="button" class="tbtn" data-close>Close</button></div>
    ${A.closed ? `<div class="na-closed">Closed by ${esc(String(A.closed.by || '').split('@')[0])} on ${new Date(A.closed.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}.</div>` : ''}
    <div class="na-grid"><div class="kpi"><div class="l">Occupancy</div><div class="v">${k.occupancy}%</div><div class="s">${k.sold} / ${k.sellable} rooms</div></div><div class="kpi"><div class="l">Room revenue</div><div class="v">${inr(k.revenueToday)}</div><div class="s">ADR ${inr(k.adr)}</div></div>
      <div class="kpi"><div class="l">Collected</div><div class="v">${inr(A.collected)}</div><div class="s">${A.awaitingApproval ? inr(A.awaitingApproval) + ' awaiting approval' : 'all approved'}</div></div><div class="kpi"><div class="l">Balance in house</div><div class="v">${inr(A.balanceDue)}</div><div class="s">${(n => n + ' booking' + (n === 1 ? '' : 's') + ' owing')(A.balances.length + A.notCheckedOut.filter(x => x.balance > 0).length)}</div></div></div>
    <div class="na-sec"><h4>Payments by method</h4>${methods.length ? `<table class="na"><tr><th>Method</th><th class="n">Received</th><th class="n">Awaiting approval</th></tr>${methods.map(m => `<tr><td>${esc(m)}</td><td class="n">${inr(A.payments[m].approved)}</td><td class="n">${A.payments[m].pending ? inr(A.payments[m].pending) : '—'}</td></tr>`).join('')}</table>` : '<p class="empty">No payments recorded for this day.</p>'}</div>
    ${Object.keys(A.extras).length ? `<div class="na-sec"><h4>Extras posted</h4><table class="na">${Object.keys(A.extras).map(x => `<tr><td>${esc((A.kinds && A.kinds[x]) || x)}</td><td class="n">${inr(A.extras[x])}</td></tr>`).join('')}</table></div>` : ''}
    <div class="na-sec"><h4>Not arrived <em>${A.noShows.length}</em></h4>${people(A.noShows, 'Every guest due has checked in.', !A.closed)}${A.noShows.length && !A.closed ? '<p class="empty">Tick the guests to mark as no-shows: their rooms are released for sale. Any payment stays on the booking.</p>' : ''}</div>
    <div class="na-sec"><h4>Due out, not checked out <em>${A.notCheckedOut.length}</em></h4>${people(A.notCheckedOut, 'Nobody overstaying.')}</div>
    <div class="na-sec"><h4>In house with a balance <em>${A.balances.length}</em></h4>${people(A.balances, 'No balances due.')}</div>
    ${A.unassigned.length ? `<div class="na-sec"><h4>Arriving this week without room numbers <em>${A.unassigned.length}</em></h4>${people(A.unassigned, '')}</div>` : ''}
    ${A.pendingPayments.length ? `<div class="na-sec"><h4>Payments awaiting the owner <em>${A.pendingPayments.length}</em></h4><p class="empty">${inr(A.pendingPayments.reduce((a, p) => a + p.amount, 0))} in all, approved from the dashboard.</p></div>` : ''}
    ${A.closed ? '' : `<button type="button" class="na-close" id="naClose">Close ${dLbl(A.date)}</button>`}
    ${A.history.length ? `<div class="na-sec" style="margin-top:14px"><h4>Closed days</h4><table class="na"><tr><th>Day</th><th class="n">Occupancy</th><th class="n">Revenue</th><th class="n">Collected</th><th class="n">No-shows</th><th>By</th></tr>${A.history.map(h => `<tr><td>${dLbl(h.date)}</td><td class="n">${h.figures ? h.figures.occupancy + '%' : '—'}</td><td class="n">${h.figures ? inr(h.figures.revenue) : '—'}</td><td class="n">${inr(h.collected)}</td><td class="n">${h.noShows}</td><td>${esc(h.by)}</td></tr>`).join('')}</table></div>` : ''}`;
  el.querySelector('#naDate').addEventListener('change', e => { el.remove(); auditSheet(e.target.value || A.today); });
  const btn = el.querySelector('#naClose');
  if (btn) btn.addEventListener('click', async () => {
    const ns = [...el.querySelectorAll('[data-ns]:checked')].map(c => c.value);
    if (!confirm(`Close ${dLbl(A.date)}${ns.length ? ` and mark ${ns.length} no-show${ns.length === 1 ? '' : 's'}` : ''}? This can't be undone.`)) return;
    btn.disabled = true;
    try { await api('/hotel/audit-close', { date: A.date, noShows: ns }); el.remove(); toast(`${dLbl(A.date)} closed`); load(); auditSheet(A.date); }
    catch (e) { toast(e.message, true); btn.disabled = false; }
  });
}

function renderTape(){
  const from = addD(date, -2), n = 16, cols = []; for (let i = 0; i < n; i++) cols.push(addD(from, i));
  const byCat = {}; D.rooms.forEach(r => { (byCat[r.cat] = byCat[r.cat] || []).push(r); });
  const wk = d => { const w = new Date(d + 'T00:00:00Z').getUTCDay(); return w === 5 || w === 6; };
  const staysIn = (no) => allStays().filter(s => s.type !== 'block' && s.rooms.some(r => r.roomNo === no));
  const bar = (s, no) => {
    const ci = s.checkin < from ? from : s.checkin, last = s.dayUse ? s.checkin : addD(s.checkout, -1); if (last < from || ci > cols[n - 1]) return null;
    const startIdx = cols.indexOf(ci), endIdx = Math.min(n - 1, cols.indexOf(last) < 0 ? n - 1 : cols.indexOf(last));
    const span = endIdx - startIdx + 1, cls = s.dayUse ? 'day' : s.checkedOutAt || s.checkout <= todayIST() ? 'past' : s.checkedInAt ? 'in' : 'fut';
    const i = s.rooms.findIndex(r => r.roomNo === no);
    return { startIdx, html: `<button type="button" class="bar-b ${cls}${moving && moving.no === s.no && moving.i === i ? ' sel' : ''}" style="width:calc(${span * 100}% + ${(span - 1)}px - 4px)" data-no="${esc(s.no)}" data-i="${i}" title="${esc(s.guest)} · ${dLbl(s.checkin)} → ${dLbl(s.checkout)}">${esc(s.guest || s.no)}${s.dayUse ? ' · ' + s.dayUse.hours + 'h' : ''}</button>` };
  };
  const head = `<thead><tr><th class="rm">Room</th>${cols.map(d => `<th class="${d === date ? 'today' : ''}${wk(d) ? ' wk' : ''}">${dLbl(d, { weekday: 'short' })}<br>${dLbl(d, { day: 'numeric' })}</th>`).join('')}</tr></thead>`;
  const unassigned = allStays().filter(s => s.type !== 'block' && s.rooms.some(r => !r.roomNo));
  const body = Object.keys(byCat).map(cat => `<tr class="cat"><th class="rm" colspan="${n + 1}">${esc(catName(cat))}</th></tr>` + byCat[cat].map(r => {
    const bars = {}; staysIn(r.no).forEach(s => { const b = bar(s, r.no); if (b) bars[b.startIdx] = (bars[b.startIdx] || '') + b.html; });
    return `<tr><th class="rm">${esc(r.no)}<small>${r.hk === 'dirty' ? 'Dirty' : r.state === 'ooo' ? 'Out of order' : ''}</small></th>${cols.map((d, i) => `<td class="${wk(d) ? 'wk' : ''}${moving && moving.cat === r.cat && moving.room !== r.no ? ' target' : ''}" data-room="${esc(r.no)}" data-d="${d}">${bars[i] || ''}</td>`).join('')}</tr>`;
  }).join('')).join('');
  $('#tape').innerHTML = `<table class="tape">${head}<tbody>${body}</tbody></table>`;
  $('#tapeNote').textContent = moving ? `Moving ${moving.guest} out of room ${moving.room}: tap a highlighted room row, or tap the booking again to cancel.` : (unassigned.length ? `${unassigned.length} booking${unassigned.length === 1 ? ' has' : 's have'} rooms with no number yet: ${unassigned.map(s => s.guest || s.no).slice(0, 4).join(', ')}. Open the booking and use Suggest room numbers.` : 'Today is underlined. Weekend nights are shaded.');
  $('#tape').onclick = async e => {
    const b = e.target.closest('.bar-b');
    if (b) { const s = allStays().find(x => x.no === b.dataset.no), i = +b.dataset.i;
      if (moving && moving.no === s.no && moving.i === i) { moving = null; renderTape(); return; }
      if (e.detail === 2) { location.href = 'stay.html?open=' + encodeURIComponent(s.no); return; }
      moving = { no: s.no, i, room: s.rooms[i].roomNo, cat: s.rooms[i].cat, guest: s.guest }; renderTape(); return; }
    const td = e.target.closest('td.target'); if (!td || !moving) return;
    const m = moving; moving = null;
    try { await api('/hotel/move', { no: m.no, index: m.i, roomNo: td.dataset.room }); toast(`${m.guest} moved to room ${td.dataset.room}`); load(); }
    catch (err) { toast(err.message, true); renderTape(); }
  };
}
load();
setInterval(() => { if (!document.hidden && !moving && !document.querySelector('.sheet')) load(); }, 60000); // keep the board fresh at the desk
</script>
