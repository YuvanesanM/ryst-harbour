<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.googletagmanager.com https://www.google.com https://raw.githubusercontent.com https://*.google-analytics.com https://api.qrserver.com https://data.ryst.in; connect-src 'self' https://data.ryst.in wss://data.ryst.in https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://accounts.google.com https://api.open-meteo.com; frame-src https://accounts.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<script src="/staff-demo.js"></script>
<script src="/property.js" data-staff></script>
<title data-title="Guest Feedback · {name}">Guest Feedback · RYST 109A</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#9aa097;
    --danger:#c0584b; --danger-soft:#fbecea; --warn:#c98a2b; --warn-soft:#fbf3e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  a{color:var(--accent-d)}

  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 2px 18px}
  header.top img{height:38px;object-fit:contain}
  header.top .ttl{font-weight:700;font-size:18px;letter-spacing:.2px}
  header.top .ttl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  header.top .spacer{flex:1}
  .tbtn{background:var(--panel);border:1.5px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;transition:.15s}
  .tbtn:hover{border-color:var(--accent);color:var(--accent-d)}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px;box-shadow:0 6px 18px rgba(40,50,40,.04)}
  .card .lbl{font-size:11.5px;font-weight:600;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase}
  .card .val{font-size:25px;font-weight:700;margin-top:7px;letter-spacing:-.5px}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .card.hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%);border:none;color:#fff}
  .card.hero .lbl,.card.hero .sub{color:#dff0e6}

  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;font-size:12.5px}
  .bar .track{display:block;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar .fill{display:block;height:100%;background:linear-gradient(90deg,var(--warn),#a5701f);border-radius:6px}
  .bar .bamt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

  .layout{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;margin-top:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px;box-shadow:0 6px 18px rgba(40,50,40,.04)}
  .panel h2{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
  .filters{display:flex;flex-direction:column;gap:8px}
  .filters input,.filters select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13px;color:var(--ink);outline:none;width:100%}
  .filters input:focus,.filters select:focus{border-color:var(--accent)}

  .list{display:flex;flex-direction:column;gap:10px}
  .fb-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 6px 18px rgba(40,50,40,.04)}
  .fb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .fb-guest{font-weight:700;font-size:14.5px}
  .fb-meta{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .fb-stars{color:var(--warn);font-size:15px;letter-spacing:2px;white-space:nowrap}
  .fb-comment{color:var(--ink);font-size:13.5px;line-height:1.55;margin-top:9px}
  .fb-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
  .fb-badge{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent-d);text-transform:uppercase}
  .fb-publish{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;text-transform:uppercase}
  .fb-publish:hover{border-color:var(--accent);color:var(--accent-d)}
  .fb-publish.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fb-del{background:none;border:none;color:var(--muted2);font-size:12px;text-decoration:underline;cursor:pointer}
  .fb-del:hover{color:var(--danger)}
  .empty{color:var(--muted2);font-size:13px;text-align:center;padding:40px 20px}

  #loader{position:fixed;inset:0;background:rgba(243,244,241,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:90;color:var(--muted)}
  #loader.hide{display:none}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr 1fr}
  }
  @media(max-width:480px){
    .cards{grid-template-columns:1fr}
  }
</style>
<link rel="manifest" href="/staff.webmanifest">
<link rel="apple-touch-icon" href="/assets/staff-apple-touch-icon.png">
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/staff-sw.js').catch(()=>{}));</script>
<meta name="theme-color" content="#0e2420">
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="logo" alt="RYST" src="/assets/stay-logo.webp" />
    <div class="ttl">Guest Feedback<small><span data-prop="name">RYST 109A</span> · Post-stay reviews</small></div>
    <div class="spacer"></div>
    <button class="tbtn" onclick="window.location.href='login.html'">⌂ Home</button>
  </header>

  <div class="cards">
    <div class="card hero">
      <div class="lbl">Average rating</div>
      <div class="val" id="cAvg">—</div>
      <div class="sub" id="cAvgSub">out of 5</div>
    </div>
    <div class="card">
      <div class="lbl">Total reviews</div>
      <div class="val" id="cTotal">—</div>
      <div class="sub">all time</div>
    </div>
    <div class="card">
      <div class="lbl">Featurable</div>
      <div class="val" id="cFeature">—</div>
      <div class="sub">okay to publish as testimonial</div>
    </div>
    <div class="card">
      <div class="lbl">Published</div>
      <div class="val" id="cPublished">—</div>
      <div class="sub">live on <span data-prop="websiteHost">stay.ryst.in</span></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <h2>Rating distribution</h2>
    <div class="bars" id="distBars"></div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>Search &amp; filter</h2>
      <div class="filters">
        <input id="fSearch" placeholder="Guest name or booking no…" />
        <select id="fRating">
          <option value="all">All ratings</option>
          <option value="5">5 stars</option>
          <option value="4">4 stars</option>
          <option value="3">3 stars</option>
          <option value="2">2 stars</option>
          <option value="1">1 star</option>
        </select>
        <select id="fFeature">
          <option value="all">All reviews</option>
          <option value="yes">Featurable only</option>
        </select>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div id="loader">
  <div class="spin" id="loaderSpin"></div>
  <div id="loaderMsg">Loading feedback…</div>
  <button class="tbtn" id="loaderRetry" style="display:none">Retry</button>
</div>

<script>
const PROXY_URL = 'https://data.ryst.in';
const TOKEN = localStorage.getItem('ryst_proxy_token') || '';
const ROLE  = localStorage.getItem('ryst_user_role') || 'owner';

// Owner always has full access. Coordinator/caretaker need the 'feedback'
// module granted in Settings → User Access — server-enforced on /feedback
// regardless, this just avoids loading a page the user can't actually use.
function hasModule(mod){
  let modules;
  try { modules = JSON.parse(localStorage.getItem('ryst_user_modules') || 'null'); } catch(e) { modules = null; }
  if(!Array.isArray(modules)) modules = ROLE === 'caretaker' ? ['petty-cash','inventory','checklist'] : [];
  return ROLE === 'owner' || modules.includes(mod);
}

if(!TOKEN){ window.location.href = 'login.html'; }
if(!hasModule('feedback')){ window.location.href = 'login.html'; }

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = ts => { const d = new Date(ts); return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}); };
const stars = n => '★'.repeat(n) + '☆'.repeat(5-n);

let ENTRIES = [];
let FILTERS = { q:'', rating:'all', feature:'all' };

async function load(){
  const loader = $('#loader'), msgEl = $('#loaderMsg'), retryBtn = $('#loaderRetry');
  loader.classList.remove('hide');
  $('#loaderSpin').style.display = '';
  retryBtn.style.display = 'none';
  msgEl.textContent = 'Loading feedback…';

  const ctrl = new AbortController();
  const slowTimer = setTimeout(() => { msgEl.textContent = 'Waking up the server… this can take up to a minute.'; }, 4000);
  const abortTimer = setTimeout(() => ctrl.abort(), 75000);
  try{
    const res = await fetch(PROXY_URL+'/feedback', { headers:{'X-Token':TOKEN}, signal: ctrl.signal });
    if(res.status===401){ localStorage.removeItem('ryst_proxy_token'); window.location.href='login.html'; return; }
    if(!res.ok) throw new Error('Server error ('+res.status+')');
    const data = await res.json().catch(()=>({}));
    ENTRIES = Array.isArray(data.entries) ? data.entries : [];
    render();
    loader.classList.add('hide');
  }catch(e){
    $('#loaderSpin').style.display = 'none';
    msgEl.textContent = (e && e.name === 'AbortError')
      ? 'Server timed out — please retry.'
      : 'Could not load feedback — ' + (e && e.message ? e.message : 'check your connection.');
    retryBtn.style.display = '';
  } finally {
    clearTimeout(slowTimer); clearTimeout(abortTimer);
  }
}
$('#loaderRetry').addEventListener('click', load);

async function pushEntries(){
  const res = await fetch(PROXY_URL+'/feedback', {
    method:'PUT', headers:{'X-Token':TOKEN,'Content-Type':'application/json'},
    body: JSON.stringify({version:1, entries: ENTRIES})
  });
  if(res.status===401){ localStorage.removeItem('ryst_proxy_token'); window.location.href='login.html'; return false; }
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    throw new Error(data.error || ('Save failed ('+res.status+')'));
  }
  return true;
}

function passFilter(e){
  if(FILTERS.rating!=='all' && e.rating!==Number(FILTERS.rating)) return false;
  if(FILTERS.feature==='yes' && !e.allowFeature) return false;
  const q = FILTERS.q.trim().toLowerCase();
  if(q && !((e.guest||'').toLowerCase().includes(q) || (e.bookingNo||'').toLowerCase().includes(q))) return false;
  return true;
}

function render(){
  const total = ENTRIES.length;
  const avg = total ? ENTRIES.reduce((s,e)=>s+(Number(e.rating)||0),0)/total : 0;
  const featurable = ENTRIES.filter(e=>e.allowFeature).length;
  const published = ENTRIES.filter(e=>qualifiesForSite(e) && e.approved).length;

  $('#cAvg').textContent = total ? avg.toFixed(1) : '—';
  $('#cTotal').textContent = total;
  $('#cPublished').textContent = published;
  $('#cFeature').textContent = featurable;

  const dist = [5,4,3,2,1].map(n => [n, ENTRIES.filter(e=>e.rating===n).length]);
  const max = Math.max(1, ...dist.map(d=>d[1]));
  $('#distBars').innerHTML = dist.map(([n,c])=>`
    <div class="bar"><span>${n} ★</span>
      <span class="track"><span class="fill" style="width:${c?Math.max(4,c/max*100):0}%"></span></span>
      <span class="bamt">${c}</span></div>`).join('');

  const filtered = ENTRIES.filter(passFilter).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const list = $('#list');
  if(!filtered.length){ list.innerHTML = '<div class="empty">No feedback yet.</div>'; return; }
  list.innerHTML = filtered.map(e=>`
    <div class="fb-item">
      <div class="fb-top">
        <div>
          <div class="fb-guest">${esc(e.guest||'—')}</div>
          <div class="fb-meta">${fmtDate(e.createdAt)}${e.bookingNo?' · '+esc(e.bookingNo):''}</div>
        </div>
        <span class="fb-stars">${stars(Number(e.rating)||0)}</span>
      </div>
      ${e.comment ? `<div class="fb-comment">${esc(e.comment)}</div>` : ''}
      <div class="fb-foot">
        <span style="display:flex;gap:6px;align-items:center">
          ${e.allowFeature ? '<span class="fb-badge">OK to feature</span>' : ''}
          ${qualifiesForSite(e) ? `<button class="fb-publish ${e.approved?'on':''}" onclick="toggleApproved('${esc(e.id)}')">${e.approved?'✓ Published':'Publish to site'}</button>` : ''}
        </span>
        <button class="fb-del" onclick="deleteEntry('${esc(e.id)}')">Delete</button>
      </div>
    </div>`).join('');
}

// Publishing to the public testimonials section needs guest consent AND a
// 4-5 star rating — a guest ticking "okay to feature" on the form isn't the
// same as this specific comment being fit for the marketing site, so the
// button (and the /testimonials feed itself, server-side) only ever
// considers entries that clear both bars.
function qualifiesForSite(e){ return e.allowFeature===true && Number(e.rating)>=4; }

async function toggleApproved(id){
  const idx = ENTRIES.findIndex(e=>e.id===id);
  if(idx<0) return;
  const prev = ENTRIES[idx].approved;
  ENTRIES[idx].approved = !prev;
  try{
    const ok = await pushEntries();
    if(ok===false) return;
    render();
  }catch(err){
    ENTRIES[idx].approved = prev;
    alert('Could not update: ' + err.message);
    render();
  }
}

async function deleteEntry(id){
  if(!confirm('Delete this feedback entry? This cannot be undone.')) return;
  const idx = ENTRIES.findIndex(e=>e.id===id);
  if(idx<0) return;
  const removed = ENTRIES.splice(idx,1)[0];
  try{
    const ok = await pushEntries();
    if(ok===false) return;
    render();
  }catch(err){
    ENTRIES.splice(idx,0,removed);
    alert('Could not delete: ' + err.message);
    render();
  }
}

$('#fSearch').addEventListener('input', e=>{ FILTERS.q=e.target.value; render(); });
$('#fRating').addEventListener('change', e=>{ FILTERS.rating=e.target.value; render(); });
$('#fFeature').addEventListener('change', e=>{ FILTERS.feature=e.target.value; render(); });

load();
</script>
</body>
</html>
