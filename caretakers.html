<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#9aa097;
    --danger:#c0584b; --danger-soft:#fbecea; --warn:#c98a2b; --warn-soft:#fbf3e6; --good:#2f7d54;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  button,input,textarea{font-family:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .wrap{max-width:1020px;margin:0 auto;padding:18px 16px 70px}

  header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 18px}
  header.top img{height:38px;object-fit:contain}
  header.top .ttl{font-weight:700;font-size:18px;letter-spacing:.2px}
  header.top .ttl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  header.top .spacer{flex:1}
  .tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;text-decoration:none}
  .tbtn:hover{border-color:var(--accent)}

  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-decoration:none;color:inherit;display:block}
  a.card:hover{border-color:#cfc6b8}
  .card .lbl{font-size:11px;font-weight:600;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase}
  .card .val{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .card.warn .val{color:var(--warn)}

  .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .person{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
  .p-head{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px}
  .avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-d);font-weight:700;font-size:15px}
  .p-id{min-width:0;flex:1}
  .p-name{font-size:16px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
  .p-name.unnamed{color:var(--muted)}
  .p-sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .p-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.role{background:var(--accent-soft);color:var(--accent-d);border-color:transparent}
  .pill.tg-on{background:#e6efe9;color:var(--good);border-color:transparent}
  .pill.tg-off{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .p-edit{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .p-edit:hover{border-color:var(--accent)}
  .p-note{margin:0 16px 12px;font-size:13px;color:var(--ink);background:var(--panel2);border-radius:8px;padding:8px 10px;white-space:pre-line;overflow-wrap:anywhere}
  .p-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .p-stat{padding:10px 12px;min-width:0}
  .p-stat + .p-stat{border-left:1px solid var(--line)}
  .p-stat b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .p-stat span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
  .p-stat .warnv{color:var(--warn)}
  .p-access{padding:10px 16px 0;font-size:12px;color:var(--muted)}
  .p-access .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .p-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 14px;margin-top:auto}
  .p-last{font-size:12px;color:var(--muted2);margin-right:auto}
  .abtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
  .abtn:hover{border-color:var(--accent)}
  .abtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  details.recent{border-top:1px solid var(--line)}
  details.recent summary{list-style:none;cursor:pointer;padding:10px 16px;font-size:12.5px;font-weight:600;color:var(--accent-d);display:flex;align-items:center;gap:6px}
  details.recent summary::-webkit-details-marker{display:none}
  details.recent summary::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
  details.recent[open] summary::after{transform:rotate(-135deg);margin-top:3px}
  .ev{display:flex;gap:10px;padding:7px 16px;font-size:13px;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:0}
  .ev .ev-t{flex:1;min-width:0;overflow-wrap:anywhere}
  .ev .ev-w{color:var(--muted2);font-size:12px;white-space:nowrap}
  .recent .none{padding:4px 16px 12px;font-size:12.5px;color:var(--muted2)}
  .recent-list{padding-bottom:8px}

  .empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 20px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;line-height:1.5}
  .empty .tbtn{margin-top:12px}
  .foot-note{font-size:12.5px;color:var(--muted2);margin-top:14px;line-height:1.5}

  .overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:14px;width:min(480px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(20,20,20,.25)}
  .modal h2{font-size:17px;font-weight:700;padding:18px 20px 0;overflow-wrap:anywhere}
  .modal .msub{font-size:12.5px;color:var(--muted);padding:3px 20px 0;overflow-wrap:anywhere}
  .mbody{padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:8px 20px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
  .field input,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:16px;color:var(--ink);outline:none;width:100%}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:72px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:1px solid var(--line);border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;background:var(--panel);color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.6}
  .merr{color:var(--danger);font-size:13px;min-height:16px}

  #toast{position:fixed;left:50%;bottom:calc(26px + var(--demo-h,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger)}
  .sk{background:linear-gradient(90deg,var(--panel2),#efebe4,var(--panel2));background-size:200% 100%;animation:skl 1.2s ease-in-out infinite;border-radius:12px}
  @keyframes skl{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.sk{animation:none}}
  .loadmsg{font-size:13.5px;color:var(--muted);text-align:center;padding:20px}

  @media(max-width:820px){ .people{grid-template-columns:1fr} }
  @media(max-width:600px){
    .wrap{padding:14px 12px 70px}
    .cards{grid-template-columns:1fr 1fr;gap:8px}
    .cards .card:first-child{grid-column:1 / -1}
    .card{padding:11px 12px}
    .card .val{font-size:21px}
    .row2{grid-template-columns:1fr}
    .p-stat{padding:9px 10px}
    .p-last{flex-basis:100%}
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <img alt="" src="/assets/stay-logo.webp" data-prop-src="logoUrl" />
    <div class="ttl"><span>Caretakers</span><small><span data-prop="name" data-no-i18n>RYST 109A</span> <span>· Your team at the villa</span></small></div>
    <div class="spacer"></div>
    <button class="tbtn" type="button" data-lang-toggle>தமிழ்</button>
    <button class="tbtn" type="button" onclick="location.href='login.html'">⌂ Home</button>
    <a class="tbtn" id="manageBtn" href="settings.html#team" hidden>Add or change access</a>
  </header>

  <div class="cards" id="cards" hidden>
    <div class="card"><div class="lbl">Team</div><div class="val" id="cTeam">—</div><div class="sub" id="cTeamSub"></div></div>
    <a class="card" href="checklist.html"><div class="lbl">Checklists done</div><div class="val" id="cRuns">—</div><div class="sub" id="cRunsSub">this month</div></a>
    <a class="card" id="cPettyCard" href="petty-cash.html"><div class="lbl">Petty cash waiting</div><div class="val" id="cPetty">—</div><div class="sub" id="cPettySub"></div></a>
  </div>

  <div id="list"><div class="people"><div class="sk" style="height:250px"></div><div class="sk" style="height:250px"></div></div></div>
  <p class="foot-note" id="footNote" hidden></p>
</div>

<div class="overlay" id="edOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h2 id="edTitle">Edit details</h2>
    <p class="msub" id="edSub" data-no-i18n></p>
    <div class="mbody">
      <label class="field"><span>Name</span><input id="eName" maxlength="80" autocomplete="off" placeholder="e.g. Murugan S"></label>
      <div class="row2">
        <label class="field"><span>Phone</span><input id="ePhone" maxlength="20" inputmode="tel" autocomplete="off" placeholder="+91 98400 12345"></label>
        <label class="field"><span>Joined on</span><input id="eJoined" type="date"></label>
      </div>
      <label class="field"><span>Notes</span><textarea id="eNote" maxlength="500" placeholder="e.g. Day off on Tuesdays · stays in the outhouse"></textarea></label>
      <div class="merr" id="eErr"></div>
    </div>
    <div class="mfoot"><button class="btn" type="button" id="eCancel">Cancel</button><button class="btn primary" type="button" id="eSave">Save</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
const PROXY_URL = 'https://data.ryst.in';
const TOKEN = localStorage.getItem('ryst_proxy_token') || '';
const ROLE = localStorage.getItem('ryst_user_role') || 'owner';
if(!TOKEN || ROLE !== 'owner') location.href = 'login.html';

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = s => (window.rystT ? window.rystT(s) : s);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const lc = s => String(s||'').trim().toLowerCase();
const LOCALE = window.RYST_LANG === 'ta' ? 'ta-IN' : 'en-GB';
const dayLabel = ms => {
  if(!ms) return '';
  const d = new Date(ms), today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 864e5);
  if(diff === 0) return t('Today') + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(diff === -1) return t('Yesterday');
  return d.toLocaleDateString(LOCALE, { day:'numeric', month:'short' });
};
const isoMs = iso => iso ? new Date(iso + 'T12:00:00').getTime() : 0;
const MONTH0 = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); })();
const MODULE_LABEL = { 'bookings':'Calendar & bookings', 'petty-cash':'Petty cash', 'inventory':'Inventory', 'checklist':'Checklists & issues',
  'feedback':'Guest feedback', 'reports':'Reports', 'settings':'Settings', 'restaurant':'Restaurant', 'guestRegister':'Guest register' };
const ROLE_LABEL = { caretaker:'Caretaker', coordinator:'Manager' };
const RUN_LABEL = { daily:'Daily rounds', checkin:'Check-in checklist', checkout:'Check-out checklist' };
const ICON = {
  phone:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></svg>'
};

function toast(msg, err){ const el=$('#toast'); el.textContent=msg; el.className = err ? 'show err' : 'show'; clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), 3200); }
async function get(path){
  const res = await fetch(PROXY_URL + path, { headers:{ 'X-Token':TOKEN }, cache:'no-store' });
  if(res.status === 401){ localStorage.removeItem('ryst_proxy_token'); location.href='login.html'; throw new Error('Signed out'); }
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error || ('Could not load (' + res.status + ')'));
  return d;
}

let TEAM = null, RUNS = [], ISSUES = [], PETTY = [], ERR = '';
async function load(){
  const slow = setTimeout(()=>{ if(!TEAM) $('#list').innerHTML = '<p class="loadmsg">' + esc(t('Still loading… the first open of the day can take up to a minute.')) + '</p>'; }, 4000);
  // Activity is best-effort: a villa without the caretaker plan (or a
  // transient error) still gets the roster.
  const opt = (path, pick) => get(path).then(pick, () => []);
  try{
    const [team, runs, issues, petty] = await Promise.all([
      get('/team'),
      opt('/checklist', d => Array.isArray(d.runs) ? d.runs : []),
      opt('/issues', d => Array.isArray(d.issues) ? d.issues : []),
      opt('/petty-cash', d => Array.isArray(d.entries) ? d.entries : [])
    ]);
    TEAM = team; RUNS = runs; ISSUES = issues; PETTY = petty; ERR = '';
  }catch(e){ ERR = e.message; }
  finally{ clearTimeout(slow); }
  render();
}

// Everything one person did, newest first.
function eventsFor(email){
  const ev = [];
  RUNS.forEach(r => {
    if(r.status === 'completed' && lc(r.completedBy) === email) ev.push({ at:r.completedAt, kind:'run', text:(RUN_LABEL[r.type]||'Checklist') + ' done' + (r.guest ? ' — ' + r.guest : '') });
    else if(r.status !== 'completed' && lc(r.startedBy) === email) ev.push({ at:r.startedAt, kind:'run-open', text:(RUN_LABEL[r.type]||'Checklist') + ' started' + (r.guest ? ' — ' + r.guest : '') });
  });
  ISSUES.forEach(i => {
    if(lc(i.reportedBy) === email) ev.push({ at:i.reportedAt, kind:'rep', text:'Reported: ' + i.title + (i.area ? ' (' + i.area + ')' : '') });
    if(i.status === 'fixed' && lc(i.fixedBy) === email) ev.push({ at:i.fixedAt, kind:'fix', text:'Fixed: ' + i.title });
  });
  PETTY.forEach(e => {
    if(e.type === 'expense' && lc(e.createdBy) === email) ev.push({ at:e.createdAt || isoMs(e.date), kind:'exp', text:'Spent ' + inr(num(e.amount)) + ' — ' + (e.note || e.category || 'expense') + (e.status === 'pending' ? ' · waiting' : '') });
  });
  return ev.filter(e => e.at).sort((a,b) => b.at - a.at);
}
function statsFor(email){
  const runs = RUNS.filter(r => r.status === 'completed' && lc(r.completedBy) === email && r.completedAt >= MONTH0).length;
  const fixed = ISSUES.filter(i => i.status === 'fixed' && lc(i.fixedBy) === email && i.fixedAt >= MONTH0).length;
  const reported = ISSUES.filter(i => lc(i.reportedBy) === email && i.reportedAt >= MONTH0).length;
  const mine = PETTY.filter(e => e.type === 'expense' && lc(e.createdBy) === email);
  const spent = mine.filter(e => isoMs(e.date) >= MONTH0).reduce((a,e) => a + num(e.amount), 0);
  const waiting = mine.filter(e => e.status === 'pending').reduce((a,e) => a + num(e.amount), 0);
  return { runs, fixed, reported, spent, waiting };
}
const initials = (name, email) => {
  const src = (name || email.split('@')[0]).replace(/[^\p{L}\p{N} ._-]/gu, ' ').trim();
  const parts = src.split(/[ ._-]+/).filter(Boolean);
  return ((parts[0]||'?').charAt(0) + (parts.length > 1 ? parts[parts.length-1].charAt(0) : '')).toUpperCase();
};
const since = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString(LOCALE, { month:'short', year:'numeric' }) : '';
const waNumber = phone => { let d = String(phone||'').replace(/\D/g,''); if(d.length === 10) d = '91' + d; return d; };

function render(){
  if(ERR){
    $('#cards').hidden = true;
    $('#list').innerHTML = `<div class="empty"><div>${esc(ERR)}</div><button class="tbtn" type="button" id="retry">Retry</button></div>`;
    $('#retry').onclick = () => { $('#list').innerHTML = '<div class="people"><div class="sk" style="height:250px"></div></div>'; load(); };
    return;
  }
  const members = (TEAM && TEAM.members) || [];
  const admin = !!(TEAM && TEAM.canManageAccess);
  $('#manageBtn').hidden = !admin;
  if(!members.length){
    $('#cards').hidden = true;
    $('#list').innerHTML = `<div class="empty"><div><b>No caretakers yet.</b></div><div>${admin
      ? 'Add your caretaker by their Google email in Settings → Team. They sign in with that email and see only what you allow.'
      : 'Ask your villa admin to add your caretaker in Settings → Team.'}</div>${admin ? '<a class="tbtn" href="settings.html#team">Add a caretaker</a>' : ''}</div>`;
    $('#footNote').hidden = true;
    return;
  }
  const stats = {}; members.forEach(m => stats[m.email] = statsFor(m.email));
  const all = Object.values(stats);
  $('#cards').hidden = false;
  $('#cTeam').textContent = members.length;
  const tg = members.filter(m => m.telegram).length;
  $('#cTeamSub').textContent = tg === members.length ? 'all get Telegram alerts' : tg + ' of ' + members.length + ' on Telegram';
  $('#cRuns').textContent = all.reduce((a,s) => a + s.runs, 0);
  const waiting = all.reduce((a,s) => a + s.waiting, 0);
  $('#cPetty').textContent = inr(waiting);
  $('#cPettyCard').classList.toggle('warn', waiting > 0);
  $('#cPettySub').textContent = waiting > 0 ? 'to reimburse' : 'nothing to reimburse';

  const order = { caretaker:0, coordinator:1 };
  const sorted = members.slice().sort((a,b) => (order[a.role] - order[b.role]) || (a.name||a.email).localeCompare(b.name||b.email));
  $('#list').innerHTML = '<div class="people">' + sorted.map(m => {
    const s = stats[m.email], ev = eventsFor(m.email), last = ev[0];
    const display = m.name || m.email.split('@')[0];
    const nb = x => `<span style="white-space:nowrap">${esc(x)}</span>`;
    const sub = [m.name ? esc(m.email) : '', m.phone ? nb(m.phone) : '', m.joined ? nb(t('Since') + ' ' + since(m.joined)) : ''].filter(Boolean);
    const mods = (m.modules || []).map(k => `<span class="pill">${esc(t(MODULE_LABEL[k] || k))}</span>`).join('');
    return `<article class="person" data-email="${esc(m.email)}">
      <div class="p-head">
        <div class="avatar" aria-hidden="true" data-no-i18n>${esc(initials(m.name, m.email))}</div>
        <div class="p-id">
          <div class="p-name${m.name ? '' : ' unnamed'}" data-no-i18n>${esc(display)}</div>
          ${sub.length ? `<div class="p-sub" data-no-i18n>${sub.join(' · ')}</div>` : ''}
          <div class="p-pills">
            <span class="pill role">${esc(t(ROLE_LABEL[m.role] || m.role))}</span>
            <span class="pill ${m.telegram ? 'tg-on' : 'tg-off'}">${esc(t(m.telegram ? 'Telegram connected' : 'No Telegram alerts'))}</span>
          </div>
        </div>
        <button class="p-edit" type="button" data-edit="${esc(m.email)}">${m.name || m.phone ? 'Edit' : 'Add details'}</button>
      </div>
      ${m.note ? `<div class="p-note" data-no-i18n>${esc(m.note)}</div>` : ''}
      <div class="p-stats" aria-label="${esc(t('This month'))}">
        <div class="p-stat"><b>${s.runs}</b><span>${esc(t('checklists done'))}</span></div>
        <div class="p-stat"><b>${s.reported}<small style="font-size:12px;font-weight:500;color:var(--muted)"> / ${s.fixed}</small></b><span>${esc(t('issues reported / fixed'))}</span></div>
        <div class="p-stat"><b class="${s.waiting > 0 ? 'warnv' : ''}">${inr(s.spent)}</b><span>${s.waiting > 0 ? esc(inr(s.waiting)) + ' ' + esc(t('waiting')) : esc(t('spent'))}</span></div>
      </div>
      <div class="p-access">${esc(t('Can open'))}<div class="chips">${mods || `<span class="pill">${esc(t('Nothing yet'))}</span>`}</div></div>
      <div class="p-foot">
        <span class="p-last">${last ? esc(t('Last active')) + ' ' + esc(dayLabel(last.at)) : esc(t('No activity yet'))}</span>
        ${m.phone ? `<a class="abtn" href="tel:${esc(m.phone.replace(/[^\d+]/g,''))}">${ICON.phone}${esc(t('Call'))}</a><a class="abtn" href="https://wa.me/${esc(waNumber(m.phone))}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>` : ''}
      </div>
      <details class="recent"><summary>${esc(t('Recent activity'))}</summary>
        ${ev.length ? '<div class="recent-list">' + ev.slice(0, 8).map(e => `<div class="ev"><span class="ev-t" data-no-i18n>${esc(e.text)}</span><span class="ev-w">${esc(dayLabel(e.at))}</span></div>`).join('') + '</div>'
          : `<p class="none">${esc(t('Nothing recorded yet — checklists, issues and expenses they log show up here.'))}</p>`}
      </details>
    </article>`;
  }).join('') + '</div>';
  $('#footNote').hidden = false;
  $('#footNote').textContent = t('Numbers are for this month. Owners are not listed here.') + ' ' + (admin ? t('Who can sign in and what they can open is set in Settings → Team.') : t('Only the villa admin can change who can sign in.'));
}

/* ---- edit details ---- */
let editing = null;
function openEdit(email){
  const m = ((TEAM && TEAM.members) || []).find(x => x.email === email); if(!m) return;
  editing = m.email;
  $('#edTitle').textContent = m.name ? t('Edit details') : t('Add details');
  $('#edSub').textContent = m.email;
  $('#eName').value = m.name || ''; $('#ePhone').value = m.phone || ''; $('#eJoined').value = m.joined || ''; $('#eNote').value = m.note || '';
  $('#eErr').textContent = '';
  $('#edOverlay').classList.add('show'); setTimeout(() => $('#eName').focus(), 50);
}
function closeEdit(){ $('#edOverlay').classList.remove('show'); editing = null; }
$('#list').addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if(b) openEdit(b.dataset.edit); });
$('#eCancel').addEventListener('click', closeEdit);
$('#edOverlay').addEventListener('click', e => { if(e.target.id === 'edOverlay') closeEdit(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#edOverlay').classList.contains('show')) closeEdit(); });
$('#eSave').addEventListener('click', async () => {
  const phone = $('#ePhone').value.trim();
  if(phone && !/^\+?[0-9 ()-]{6,20}$/.test(phone)){ $('#eErr').textContent = t('Phone number can only have digits, spaces and +'); return; }
  const b = $('#eSave'); b.disabled = true; b.textContent = t('Saving…');
  try{
    const res = await fetch(PROXY_URL + '/team/profile', { method:'POST', headers:{ 'X-Token':TOKEN, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:editing, name:$('#eName').value.trim(), phone, joined:$('#eJoined').value, note:$('#eNote').value.trim() }) });
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(d.error || ('Could not save (' + res.status + ')'));
    TEAM = d; render(); closeEdit(); toast(t('Saved'));
  }catch(err){ $('#eErr').textContent = err.message; }
  finally{ b.disabled = false; b.textContent = t('Save'); }
});
load();
</script>
