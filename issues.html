<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://data.ryst.in; connect-src 'self' https://data.ryst.in; object-src 'none'; base-uri 'self'; form-action 'self';">

<script src="/property.js" data-staff></script>

<script src="/assets/app/shell.js?v=fbd18e00"></script>
<script src="/i18n.js"></script>
<title data-title="Issues · {name}">Issues · RYST 109A</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#9aa097;
    --danger:#c0584b; --danger-soft:#fbecea; --warn:#c98a2b; --warn-soft:#fbf3e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 70px}

  header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 18px}
  header.top img{height:38px;object-fit:contain}
  header.top .ttl{font-weight:700;font-size:18px;letter-spacing:.2px}
  header.top .ttl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  header.top .spacer{flex:1}
  .badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
  .badge.owner{background:var(--accent-soft);color:var(--accent-d)}
  .badge.caretaker{background:var(--warn-soft);color:var(--warn)}
  .tbtn{background:var(--panel);border:1.5px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600}
  .tbtn:hover{border-color:var(--accent);color:var(--accent-d)}
  .tbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  .report-big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;margin-bottom:16px;box-shadow:0 8px 20px rgba(47,125,84,.22)}
  .report-big:hover{background:var(--accent-d)}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .card .lbl{font-size:11px;font-weight:600;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase}
  .card .val{font-size:24px;font-weight:700;margin-top:4px}
  .card .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .card.urgent .val{color:var(--danger)}
  .card.open .val{color:var(--warn)}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px;background:var(--panel)}
  .seg button{border:0;background:transparent;padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}

  .issue{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--muted2);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px}
  .issue.u-urgent{border-left-color:var(--danger)}
  .issue.u-normal{border-left-color:var(--warn)}
  .issue.u-low{border-left-color:#8fb4a1}
  .issue.fixed{border-left-color:var(--accent);opacity:.92}
  .issue h3{font-size:15px;font-weight:700;line-height:1.3}
  .issue .where{font-size:12.5px;color:var(--muted);margin-top:2px}
  .issue .note{font-size:13px;color:var(--ink);margin-top:6px;white-space:pre-line}
  .issue .meta{font-size:11.5px;color:var(--muted2);margin-top:6px}
  .issue .fixline{font-size:12.5px;color:var(--accent-d);margin-top:6px;white-space:pre-line}
  .issue .thumbs{display:flex;gap:6px;margin-top:8px}
  .issue .thumbs img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .issue .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .pill{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
  .pill.urgent{background:var(--danger-soft);color:var(--danger)}
  .pill.normal{background:var(--warn-soft);color:var(--warn)}
  .pill.low{background:var(--panel2);color:var(--muted)}
  .pill.fixed{background:var(--accent-soft);color:var(--accent-d)}
  .abtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
  .abtn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
  .abtn.del{color:var(--danger)}
  body.caretaker-mode .owner-only{display:none!important}
  .empty{color:var(--muted2);font-size:13.5px;text-align:center;padding:34px 20px;background:var(--panel);border:1px dashed var(--line);border-radius:12px}

  .overlay{position:fixed;inset:0;background:rgba(29,33,28,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(20,30,20,.28)}
  .modal h2{font-size:17px;font-weight:700;padding:18px 20px 0}
  .mbody{padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:8px 20px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
  .field input,.field textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:16px;color:var(--ink);outline:none;width:100%}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:70px}
  .urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .urg label{border:1.5px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--panel2)}
  .urg input{position:absolute;opacity:0;pointer-events:none}
  .urg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d)}
  .urg label.u:has(input:checked){border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
  .photo-btn{border:1.5px dashed #cdd1cb;background:var(--panel2);border-radius:11px;padding:14px;font-size:14px;font-weight:600;color:var(--muted);text-align:center}
  .photo-prev{display:flex;align-items:center;gap:10px}
  .photo-prev img{width:110px;height:82px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .photo-prev button{background:none;border:0;color:var(--danger);font-size:12.5px;text-decoration:underline}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;background:var(--panel2);color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.6}
  .merr{color:var(--danger);font-size:13px;min-height:16px}

  .lb{position:fixed;inset:0;background:rgba(10,14,13,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:90vh;border-radius:10px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger)}
  #loader{position:fixed;inset:0;background:rgba(243,244,241,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:90;color:var(--muted)}
  #loader.hide{display:none}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:600px){
    .wrap{padding:14px 12px 70px}
    header.top .badge{display:none}
    .cards{gap:8px}
    .card{padding:11px 10px}
    .card .val{font-size:21px}
    .issue{grid-template-columns:1fr}
    .issue .acts{flex-direction:row;justify-content:flex-start;flex-wrap:wrap;align-items:center}
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <img alt="" src="/assets/stay-logo.webp" data-prop-src="logoUrl" />
    <div class="ttl"><span>Issues</span><small><span data-prop="name" data-no-i18n>RYST 109A</span> <span>· Problems &amp; repairs</span></small></div>
    <div class="spacer"></div>
    <span id="roleBadge" class="badge owner">Owner</span>
    <button class="tbtn" type="button" data-lang-toggle>தமிழ்</button>
    <button class="tbtn" type="button" onclick="location.href='login.html'">⌂ Home</button>
  </header>

  <button class="report-big" type="button" id="btnReport">＋ Report a problem</button>

  <div class="cards">
    <div class="card open"><div class="lbl">Open</div><div class="val" id="cOpen">—</div><div class="sub">waiting to be fixed</div></div>
    <div class="card urgent"><div class="lbl">Urgent</div><div class="val" id="cUrgent">—</div><div class="sub">need attention now</div></div>
    <div class="card"><div class="lbl">Fixed</div><div class="val" id="cFixed">—</div><div class="sub">fixed this month</div></div>
  </div>

  <div class="seg" role="tablist">
    <button type="button" class="on" data-view="open">Open issues</button>
    <button type="button" data-view="fixed">Fixed issues</button>
  </div>
  <div id="list"></div>
</div>

<div class="overlay" id="repOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="repTitle">
    <h2 id="repTitle">Report a problem</h2>
    <div class="mbody">
      <label class="field"><span>What is the problem?</span><input id="rTitle" maxlength="140" placeholder="e.g. Bathroom tap leaking" autocomplete="off"></label>
      <label class="field"><span>Where?</span><input id="rArea" maxlength="80" placeholder="e.g. Bedroom 2" autocomplete="off"></label>
      <div class="field"><span>How urgent?</span>
        <div class="urg">
          <label><input type="radio" name="urg" value="low"><span>Can wait</span></label>
          <label><input type="radio" name="urg" value="normal" checked><span>Soon</span></label>
          <label class="u"><input type="radio" name="urg" value="urgent"><span>Urgent</span></label>
        </div>
      </div>
      <label class="field"><span>More details (optional)</span><textarea id="rNote" maxlength="1000"></textarea></label>
      <div id="rPhotoBox"></div>
      <div class="merr" id="rErr"></div>
    </div>
    <div class="mfoot"><button class="btn" type="button" id="rCancel">Cancel</button><button class="btn primary" type="button" id="rSend">Send report</button></div>
  </div>
</div>

<div class="overlay" id="fixOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fixTitle">
    <h2 id="fixTitle" data-no-i18n></h2>
    <div class="mbody">
      <label class="field"><span>What was done? (optional)</span><textarea id="fNote" maxlength="1000" placeholder="e.g. Replaced the washer"></textarea></label>
      <div class="field"><span>Photo of the fix (optional)</span><div id="fPhotoBox"></div></div>
      <div class="merr" id="fErr"></div>
    </div>
    <div class="mfoot"><button class="btn" type="button" id="fCancel">Cancel</button><button class="btn primary" type="button" id="fSave">Save as fixed</button></div>
  </div>
</div>

<div class="lb" id="lb"><img alt=""></div>
<div id="loader"><div class="spin" id="loaderSpin"></div><div id="loaderMsg">Loading issues…</div><button class="tbtn" id="loaderRetry" style="display:none">Retry</button></div>
<div id="toast"></div>

<script>
const PROXY_URL = 'https://data.ryst.in';
const TOKEN = localStorage.getItem('ryst_proxy_token') || '';
const ROLE = localStorage.getItem('ryst_user_role') || 'owner';
const isOwner = ROLE === 'owner';
function hasModule(mod){
  let modules; try { modules = JSON.parse(localStorage.getItem('ryst_user_modules') || 'null'); } catch(e) { modules = null; }
  if(!Array.isArray(modules)) modules = ROLE === 'caretaker' ? ['petty-cash','inventory','checklist'] : [];
  return ROLE === 'owner' || modules.includes(mod);
}
if(!TOKEN || !hasModule('checklist')) location.href = 'login.html';

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = s => (window.rystT ? window.rystT(s) : s);
$('#roleBadge').textContent = isOwner ? 'Owner' : 'Caretaker';
$('#roleBadge').className = 'badge ' + (isOwner ? 'owner' : 'caretaker');
document.body.classList.toggle('caretaker-mode', !isOwner);

let ISSUES = [], VIEW = 'open';
function toast(msg, err){ const el=$('#toast'); el.textContent=msg; el.className = err ? 'show err' : 'show'; clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), 3200); }
const who = e => String(e||'').split('@')[0];
const LOCALE = window.RYST_LANG === 'ta' ? 'ta-IN' : 'en-GB';
const when = ms => { if(!ms) return ''; const d=new Date(ms); return d.toLocaleDateString(LOCALE,{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const URG_LABEL = { urgent:'Urgent', normal:'Soon', low:'Can wait' };

async function api(method, body){
  const res = await fetch(PROXY_URL+'/issues', { method, headers: Object.assign({'X-Token':TOKEN}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined, cache:'no-store' });
  if(res.status===401){ localStorage.removeItem('ryst_proxy_token'); location.href='login.html'; throw new Error('Signed out'); }
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error || ('Server error ('+res.status+')'));
  return d;
}
async function load(){
  const loader=$('#loader'), msg=$('#loaderMsg'); loader.classList.remove('hide'); $('#loaderSpin').style.display=''; $('#loaderRetry').style.display='none'; msg.textContent='Loading issues…';
  const slow = setTimeout(()=>{ msg.textContent='Still loading… the first open of the day can take up to a minute.'; }, 4000);
  try{ const d = await api('GET'); ISSUES = Array.isArray(d.issues)?d.issues:[]; render(); loader.classList.add('hide'); }
  catch(e){ $('#loaderSpin').style.display='none'; msg.textContent = e.message; $('#loaderRetry').style.display=''; }
  finally{ clearTimeout(slow); }
}
$('#loaderRetry').addEventListener('click', load);

function render(){
  const open = ISSUES.filter(i=>i.status!=='fixed');
  const now = new Date(), ym = now.getFullYear()*12+now.getMonth();
  const fixedMonth = ISSUES.filter(i=>i.status==='fixed' && i.fixedAt && (d=>d.getFullYear()*12+d.getMonth())(new Date(i.fixedAt))===ym);
  $('#cOpen').textContent = open.length;
  $('#cUrgent').textContent = open.filter(i=>i.urgency==='urgent').length;
  $('#cFixed').textContent = fixedMonth.length;
  const rank = { urgent:0, normal:1, low:2 };
  const rows = VIEW==='open'
    ? open.sort((a,b)=>(rank[a.urgency]-rank[b.urgency]) || (b.reportedAt-a.reportedAt))
    : ISSUES.filter(i=>i.status==='fixed').sort((a,b)=>b.fixedAt-a.fixedAt);
  if(!rows.length){ $('#list').innerHTML = `<div class="empty">${VIEW==='open'?'No open problems. 👍':'No fixed problems yet.'}</div>`; return; }
  $('#list').innerHTML = rows.map(i=>{
    const fixed = i.status==='fixed';
    const photos = [i.photo, i.fixPhoto].filter(Boolean);
    return `<div class="issue u-${esc(i.urgency)}${fixed?' fixed':''}">
      <div>
        <h3 data-no-i18n>${esc(i.title)}</h3>
        ${i.area?`<div class="where" data-no-i18n>📍 ${esc(i.area)}</div>`:''}
        ${i.note?`<div class="note" data-no-i18n>${esc(i.note)}</div>`:''}
        ${photos.length?`<div class="thumbs">${photos.map(p=>`<img src="${esc(p)}" alt="" data-full="${esc(p)}">`).join('')}</div>`:''}
        <div class="meta"><span>Reported</span> ${esc(when(i.reportedAt))} · <span>by</span> <span data-no-i18n>${esc(who(i.reportedBy))}</span></div>
        ${fixed?`<div class="fixline">✓ <span>Fixed on</span> ${esc(when(i.fixedAt))} · <span data-no-i18n>${esc(who(i.fixedBy))}${i.fixNote?' — '+esc(i.fixNote):''}</span></div>`:''}
      </div>
      <div class="acts">
        <span class="pill ${fixed?'fixed':esc(i.urgency)}">${fixed?'Fixed':URG_LABEL[i.urgency]||'Soon'}</span>
        ${fixed?`<button class="abtn" type="button" data-reopen="${esc(i.id)}">Reopen</button>`:`<button class="abtn go" type="button" data-fix="${esc(i.id)}">Mark fixed</button>`}
        <button class="abtn del owner-only" type="button" data-del="${esc(i.id)}">Delete</button>
      </div>
    </div>`;
  }).join('');
}
document.querySelector('.seg').addEventListener('click', e=>{
  const b=e.target.closest('[data-view]'); if(!b) return;
  VIEW=b.dataset.view; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b)); render();
});
$('#list').addEventListener('click', async e=>{
  const img=e.target.closest('img[data-full]'); if(img){ $('#lb img').src=img.dataset.full; $('#lb').classList.add('show'); return; }
  const fix=e.target.closest('[data-fix]'); if(fix) return openFix(fix.dataset.fix);
  const re=e.target.closest('[data-reopen]');
  if(re){ try{ const d=await api('POST',{action:'set-status',id:re.dataset.reopen,status:'open'}); ISSUES=d.issues; render(); toast(t('Reopened')); }catch(err){ toast(err.message,true); } return; }
  const del=e.target.closest('[data-del]');
  if(del){ if(!confirm('Delete this issue? This cannot be undone.')) return; try{ const d=await api('POST',{action:'delete',id:del.dataset.del}); ISSUES=d.issues; render(); toast(t('Issue deleted')); }catch(err){ toast(err.message,true); } }
});
$('#lb').addEventListener('click', ()=>$('#lb').classList.remove('show'));

/* ---- photo picker (shared by both forms) ---- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Please choose an image file'));
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1400, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',0.7)); }; img.onerror=()=>reject(new Error('Could not read image')); img.src=r.result; };
    r.onerror=()=>reject(new Error('Could not read file')); r.readAsDataURL(file);
  });
}
function photoPicker(box){
  const st = { data:null };
  const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.capture='environment'; input.hidden=true;
  const draw = () => {
    box.innerHTML = st.data
      ? `<div class="photo-prev"><img src="${st.data}" alt=""><button type="button">Remove</button></div>`
      : `<button type="button" class="photo-btn" style="width:100%">📷 Add a photo</button>`;
    box.appendChild(input);
    box.querySelector('button').onclick = () => { if(st.data){ st.data=null; draw(); } else { input.value=''; input.click(); } };
  };
  input.addEventListener('change', async ()=>{ try{ st.data = await compressImage(input.files[0]); draw(); }catch(e){ toast(e.message,true); } });
  st.reset = () => { st.data=null; draw(); };
  draw();
  return st;
}
const repPhoto = photoPicker($('#rPhotoBox')), fixPhoto = photoPicker($('#fPhotoBox'));

/* ---- report ---- */
function openReport(){
  $('#rTitle').value=''; $('#rArea').value=''; $('#rNote').value=''; $('#rErr').textContent='';
  document.querySelector('input[name="urg"][value="normal"]').checked = true; repPhoto.reset();
  $('#repOverlay').classList.add('show'); setTimeout(()=>$('#rTitle').focus(), 50);
}
$('#btnReport').addEventListener('click', openReport);
$('#rCancel').addEventListener('click', ()=>$('#repOverlay').classList.remove('show'));
$('#rSend').addEventListener('click', async ()=>{
  const title=$('#rTitle').value.trim(); if(!title){ $('#rErr').textContent=t('Please say what the problem is.'); return; }
  const b=$('#rSend'); b.disabled=true; b.textContent=t('Sending…');
  try{
    const d = await api('POST',{ action:'report', title, area:$('#rArea').value.trim(), urgency:document.querySelector('input[name="urg"]:checked').value, note:$('#rNote').value.trim(), photo:repPhoto.data });
    ISSUES=d.issues; VIEW='open'; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x.dataset.view==='open')); render();
    $('#repOverlay').classList.remove('show'); toast(t('Report sent — the owner has been told'));
  }catch(e){ $('#rErr').textContent=e.message; }
  finally{ b.disabled=false; b.textContent=t('Send report'); }
});

/* ---- mark fixed ---- */
let fixId = null;
function openFix(id){
  const i = ISSUES.find(x=>x.id===id); if(!i) return;
  fixId=id; $('#fixTitle').textContent = '✓ ' + i.title; $('#fNote').value=''; $('#fErr').textContent=''; fixPhoto.reset();
  $('#fixOverlay').classList.add('show');
}
$('#fCancel').addEventListener('click', ()=>$('#fixOverlay').classList.remove('show'));
$('#fSave').addEventListener('click', async ()=>{
  const b=$('#fSave'); b.disabled=true; b.textContent=t('Saving…');
  try{
    const d = await api('POST',{ action:'set-status', id:fixId, status:'fixed', fixNote:$('#fNote').value.trim(), fixPhoto:fixPhoto.data });
    ISSUES=d.issues; render(); $('#fixOverlay').classList.remove('show'); toast(t('Marked fixed'));
  }catch(e){ $('#fErr').textContent=e.message; }
  finally{ b.disabled=false; b.textContent=t('Save as fixed'); }
});
['repOverlay','fixOverlay'].forEach(id=>$('#'+id).addEventListener('click', e=>{ if(e.target.id===id) $('#'+id).classList.remove('show'); }));
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ ['repOverlay','fixOverlay'].forEach(id=>$('#'+id).classList.remove('show')); $('#lb').classList.remove('show'); } });
if(location.hash==='#report') setTimeout(openReport, 300);
load();
</script>
</body>
</html>
