<!doctype html>
<html lang="en">
<head>
<script src="/frame-guard.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://data.ryst.in https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Harbour console · RYST Harbour</title>
<link rel="icon" href="/assets/staff-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- The Harbour console: RYST Harbour's own business — the CEO dashboard,
     sales pipeline and growth tools, conversion, revenue, plans and pricing,
     villas, invites, reports, the Harbour team and its activity log. Its own Google sign-in (/auth/platform), kept
     apart from any villa's; what each person sees follows their Harbour role
     (the server checks every request too). The session is stored separately
     (harbour_console_token) so it never mixes with a villa session. -->
<link rel="stylesheet" href="/assets/app/console.css?v=8d087dc3">
</head>
<body>
<div id="signin" hidden>
  <div class="card">
    <img src="/assets/staff-icon-192.png" alt="">
    <h1 style="font-size:20px;font-weight:600">Harbour console</h1>
    <p class="hint" style="margin:0">RYST Harbour's own business: customers, sales, revenue, plans and the Harbour team. For the Harbour team only — villa staff sign in at <a href="/login.html">the villa app</a>.</p>
    <div id="gbtn"></div>
    <div class="msg err" id="signinErr" role="alert"></div>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="side" aria-label="Console sections">
    <div class="brand"><img src="/assets/staff-icon-192.png" alt=""><div><b>Harbour console</b><span>RYST Harbour</span></div></div>
    <div id="navList"></div>
    <div class="me"><b id="meName"></b><span id="meEmail"></span><div style="margin-top:4px"><span class="pill mute" id="meRole"></span></div>
      <button class="btn sm" id="signOut" type="button" style="margin-top:10px">Sign out</button></div>
  </nav>
  <div style="min-width:0">
    <div class="top"><button class="search" id="topSearch" type="button" aria-label="Search leads and pages"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search leads, pages…</span><kbd>⌘K</kbd></button><span class="sp"></span>
      <button class="btn primary" id="topNew" type="button" hidden>+ New lead</button></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="pal" id="pal" hidden><div class="box" role="dialog" aria-modal="true" aria-label="Search"><input id="palQ" placeholder="Search leads, jump to a page…" autocomplete="off" spellcheck="false"><ul id="palList" role="listbox"></ul></div></div>
<div class="drawer" id="drawer" hidden><div class="panel" id="drawerPanel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="/assets/app/console.js?v=02dfd9f3"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
