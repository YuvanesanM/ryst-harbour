<!doctype html>
<html lang="en">
<head>
<script src="/frame-guard.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://data.ryst.in https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Harbour console · RYST Harbour</title>
<link rel="icon" href="/assets/staff-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- The Harbour console: RYST Harbour's own business — overview, customers
     (villas), CRM and conversion, revenue, plan packages, invites, the Harbour
     team and its activity log. Its own Google sign-in (/auth/platform), kept
     apart from any villa's; what each person sees follows their Harbour role
     (the server checks every request too). The session is stored separately
     (harbour_console_token) so it never mixes with a villa session. -->
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --panel2:#f7f8f5;
    --line:#e3e5e0; --accent:#3d9b69; --accent-d:#2f7d54; --accent-soft:#eaf4ee;
    --ink:#1d211c; --muted:#5f655d; --muted2:#8a9087; --danger:#c0584b; --danger-soft:#fbeeec; --warn:#a8741a; --warn-soft:#fbf3e3;
    --bar:#3d9b69; --bar2:#b9d8c6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121512; --panel:#1a1e1a; --panel2:#202520; --line:#2e342e; --accent:#5cbf8a; --accent-d:#7fd3a5; --accent-soft:#1f3328;
      --ink:#e9ece7; --muted:#a7ada5; --muted2:#7f857d; --danger:#e58a7e; --danger-soft:#3a2522; --warn:#e0b25a; --warn-soft:#352b17; --bar:#5cbf8a; --bar2:#2f5a43; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent-d)}
  /* shell: sidebar on wide screens, a scrolling tab row on phones */
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
  .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
  .brand img{width:34px;height:34px;border-radius:9px}
  .brand b{display:block;font-size:15px}.brand span{font-size:11.5px;color:var(--muted)}
  .nav{border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;display:flex;gap:10px;align-items:center}
  .nav svg{width:18px;height:18px;flex:none}
  .nav:hover{background:var(--panel2);color:var(--ink)}
  .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
  .nav .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px}
  .side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
  .side .me b{color:var(--ink);display:block}
  .main{padding:22px clamp(16px,3vw,32px) 60px;min-width:0}
  .head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
  .head h1{font-size:22px;font-weight:600}
  .head p{font-size:13px;color:var(--muted);flex-basis:100%}
  .head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);z-index:5;scrollbar-width:none}
    .brand,.side .me{display:none}
    #navList{display:flex;gap:2px}
    .nav{white-space:nowrap;padding:8px 10px}
    .nav svg{display:none}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;min-width:0}
  .card h2{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:center}
  .hint{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
  .grid2>.card{margin-bottom:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--muted)}
  .btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:500;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn:disabled{opacity:.6;cursor:default}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
  .f span{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);font-weight:600}
  .f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14.5px;background:var(--panel2);outline:none;width:100%}
  .f textarea{min-height:70px;resize:vertical}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 12px}
  .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent-d);white-space:nowrap}
  .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--danger-soft);color:var(--danger)} .pill.mute{background:var(--panel2);color:var(--muted)}
  .row{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row:first-of-type{border-top:0}
  .row .grow{flex:1;min-width:180px}
  .row .meta{font-size:12.5px;color:var(--muted)}
  .row b{font-weight:600}
  .empty{font-size:13px;color:var(--muted);padding:10px 0}
  .msg{font-size:13px;margin-top:8px;min-height:18px;overflow-wrap:anywhere}
  .msg.err{color:var(--danger)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .scroll{overflow-x:auto}
  /* pipeline */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
  .col h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
  .lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;display:block}
  .lead:hover{border-color:var(--accent)}
  .lead b{display:block;font-size:13.5px}
  .lead small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .lead .due{color:var(--danger);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:var(--panel);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
  /* drawer */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}
  .drawer .panel{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--panel);padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
  .note{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:13.5px}
  .note small{display:block;color:var(--muted2);font-size:11.5px}
  /* charts */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto}
  .chart text{font-size:10px;fill:var(--muted2);font-family:inherit}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;white-space:nowrap}
  .funnel .step{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
  .funnel .track{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .funnel .fill{height:100%;background:var(--bar);border-radius:6px 4px 4px 6px}
  .funnel .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  /* plans matrix */
  .matrix td,.matrix th{text-align:center}
  .matrix td:first-child,.matrix th:first-child{text-align:left}
  .matrix input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
  .matrix input[type=number],.matrix input[type=text]{width:100%;min-width:90px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel2);text-align:center}
  #signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  #signin .card{width:min(420px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:14px;text-align:center}
  #signin img{width:60px;height:60px;border-radius:14px;margin:0 auto}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:30}
  .toast.show{opacity:1}
  .btn:focus-visible,.nav:focus-visible,.lead:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="signin" hidden>
  <div class="card">
    <img src="/assets/staff-icon-192.png" alt="">
    <h1 style="font-size:20px;font-weight:600">Harbour console</h1>
    <p class="hint" style="margin:0">RYST Harbour's own business: customers, sales, revenue, plans and the Harbour team. For the Harbour team only — villa staff sign in at <a href="/login.html">the villa app</a>.</p>
    <div id="gbtn"></div>
    <div class="msg err" id="signinErr" role="alert"></div>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="side" aria-label="Console sections">
    <div class="brand"><img src="/assets/staff-icon-192.png" alt=""><div><b>Harbour console</b><span>RYST Harbour</span></div></div>
    <div id="navList"></div>
    <div class="me"><b id="meName"></b><span id="meEmail"></span><div style="margin-top:4px"><span class="pill mute" id="meRole"></span></div>
      <button class="btn sm" id="signOut" type="button" style="margin-top:10px">Sign out</button></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="drawer" id="drawer" hidden><div class="panel" id="drawerPanel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const PROXY = 'https://data.ryst.in';
const GOOGLE_CLIENT_ID = '717827758789-99ugj40a6j2rr4r7db26shn0hivq0vv0.apps.googleusercontent.com';
const KEY = 'harbour_console_token';
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = v => v ? new Date(typeof v === 'number' ? v : (String(v).length === 10 ? v + 'T00:00:00' : v)).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtWhen = t => t ? new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';
const rs = n => '₹' + Math.round(Number(n||0)).toLocaleString('en-IN');
const today = () => { const d = new Date(Date.now() + 5.5*3600e3); return d.toISOString().slice(0,10); };
const cap = s => String(s||'').replace(/^./, c => c.toUpperCase());
let token = ''; try { token = localStorage.getItem(KEY) || ''; } catch(e) {}
let ME = { perms: [] }, page = '', cache = {};
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2800); }

async function api(method, path, body){
  const r = await fetch(PROXY + path, { method, headers: Object.assign({ 'X-Token': token }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { signOut(d.error); throw new Error(d.error || 'Signed out'); }
  if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  return d;
}

// ── sign-in ──
function showSignin(err){
  $('app').hidden = true; $('signin').hidden = false; $('signinErr').textContent = err || '';
  const draw = () => { if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(draw, 200);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: false });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', width: Math.min(320, $('gbtn').clientWidth || 300), text: 'signin_with' }); };
  draw();
}
async function onGoogle(resp){
  $('signinErr').textContent = 'Checking…';
  try {
    const r = await fetch(PROXY + '/auth/platform', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ googleIdToken: resp.credential }) });
    const d = await r.json().catch(() => ({}));
    if (!d.ok || !d.token) { $('signinErr').textContent = d.error || 'Access denied.'; return; }
    token = d.token; try { localStorage.setItem(KEY, token); } catch(e) {}
    $('signinErr').textContent = ''; start();
  } catch(e) { $('signinErr').textContent = 'Cannot reach the server — check your connection.'; }
}
function signOut(err){ token = ''; try { localStorage.removeItem(KEY); } catch(e) {} showSignin(err); }
$('signOut').addEventListener('click', () => signOut());

// ── navigation (what a role may open) ──
const ICON = {
  overview:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>', customers:'<path d="M3 21V9l9-6 9 6v12H3z"/><path d="M9 21v-6h6v6"/>',
  crm:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2 .8 3 2.8 3 6"/>',
  funnel:'<path d="M3 4h18l-7 9v6l-4 2v-8z"/>', revenue:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', plans:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>',
  invites:'<path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/>', team:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>', activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>'
};
const PAGES = [
  { key:'overview', label:'Overview', perm:'overview' }, { key:'customers', label:'Customers', perm:'customers' }, { key:'crm', label:'CRM', perm:'crm' },
  { key:'funnel', label:'Conversion', perm:'crm' }, { key:'revenue', label:'Revenue', perm:'revenue' }, { key:'plans', label:'Plans & packages', perm:'plans' },
  { key:'invites', label:'Add & invite', perm:'invites' }, { key:'team', label:'Harbour team', perm:'overview' }, { key:'activity', label:'Activity', perm:'activity' }
];
function drawNav(){
  $('navList').innerHTML = PAGES.filter(p => ME.perms.includes(p.perm)).map(p => `<button class="nav" type="button" data-page="${p.key}"${p.key===page?' aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[p.key]}</svg>${p.label}${p.key==='crm'&&ME.dueCount?`<span class="count">${ME.dueCount}</span>`:''}</button>`).join('');
}
$('navList').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) go(b.dataset.page); });
function go(p){
  if (!PAGES.some(x => x.key === p && ME.perms.includes(x.perm))) p = 'overview';
  page = p; closeDrawer(); try { history.replaceState(null, '', '#' + p); } catch(e) {}
  drawNav(); $('main').innerHTML = '<div class="empty">Loading…</div>'; window.scrollTo(0, 0);
  ({ overview, customers, crm, funnel, revenue, plans, invites, team, activity })[p]().catch(e => { $('main').innerHTML = `<div class="card"><div class="msg err">${esc(e.message)}</div></div>`; });
}
const head = (title, sub, actions) => `<div class="head"><h1>${esc(title)}</h1>${actions ? `<div class="act">${actions}</div>` : ''}<p>${sub}</p></div>`;
const kpi = (n, l) => `<div class="kpi"><b>${n}</b><span>${esc(l)}</span></div>`;

async function start(){
  $('signin').hidden = true; $('app').hidden = false;
  try { const t = await api('GET', '/platform/team'); ME = { email: t.me, role: t.role, perms: t.perms, roles: t.roles, team: t.team }; }
  catch(e) { return signOut(e.message); }
  const m = (ME.team || []).find(x => x.email === ME.email) || {};
  $('meName').textContent = m.name || ME.email; $('meEmail').textContent = m.name ? ME.email : '';
  $('meRole').textContent = ((ME.roles || []).find(r => r.key === ME.role) || {}).label || ME.role;
  go((location.hash || '').slice(1) || 'overview');
}

// ── charts: one series, one axis, hover tooltips ──
function barChart(el, rows, valueKey, fmt){
  const W = Math.max(300, el.clientWidth || 600), H = 200, L = 52, R = 6, T = 10, B = 24, max = Math.max(1, ...rows.map(r => r[valueKey]));
  const p10 = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / p10) * p10, step = (W - L - R) / rows.length, bw = Math.max(6, Math.min(44, step - 8));
  const y = v => T + (H - T - B) * (1 - v / top);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${[0, top/2, top].map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
    ${rows.map((r, i) => { const x = L + i*step + (step-bw)/2, yy = y(r[valueKey]), h = y(0) - yy, rr = Math.min(4, h, bw/2);
      return `${h > 0 ? `<path fill="var(--bar)" d="M${x},${y(0)} V${yy+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${y(0)} Z"/>` : ''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text><rect data-i="${i}" x="${L+i*step}" y="${T}" width="${step}" height="${H-T-B}" fill="transparent"/>`; }).join('')}</svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.addEventListener('pointermove', e => { const h = e.target.closest('rect[data-i]'); if (!h) return; const r = rows[+h.dataset.i], b = svg.getBoundingClientRect();
    tip.textContent = `${r.full || r.label}: ${fmt(r[valueKey])}`; tip.style.left = ((L + (+h.dataset.i + .5) * step) / W * b.width) + 'px'; tip.style.top = (y(r[valueKey]) / H * b.height) + 'px'; tip.style.opacity = 1; });
  svg.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
}
const monLabel = m => new Date(m + '-01T00:00:00').toLocaleDateString(undefined, { month: 'short' });
const monFull = m => new Date(m + '-01T00:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

// ── Overview ──
async function overview(){
  const d = await api('GET', '/platform/overview');
  ME.dueCount = d.crm ? d.crm.followUps.length : 0; drawNav();
  let h = head('Overview', 'What needs attention across RYST Harbour today.');

function billPill(b){
  if (!b) return '<span class="pill warn">not billed</span>';
  if (b.complimentary) return `<span class="pill">${esc(cap(b.tier))} · complimentary</span>`;
  const d = n => n === 1 ? '1 day' : n + ' days';
  const m = { trial: [`Trial${b.daysLeft != null ? ', ' + d(b.daysLeft) + ' left' : ''}`, ''], active: [`${cap(b.tier)}${b.paidUntil ? ' · to ' + fmtDay(b.paidUntil) : ''}`, ''], grace: [`${cap(b.tier)} · due, ${d(b.daysLeft || 0)} grace`, 'warn'], lapsed: ['Read-only', 'err'] }[b.effective] || [b.effective, ''];
  return `<span class="pill ${m[1]}">${esc(m[0])}</span>`;
}

  h += `<div class="kpis">${kpi(d.total, 'Leads')}${kpi(pct((d.steps.find(s => s.stage==='trial')||{}).count||0, first), 'Lead → trial')}${kpi(pct((d.steps.find(s => s.stage==='won')||{}).count||0, (d.steps.find(s => s.stage==='trial')||{}).count||0), 'Trial → won')}${kpi(d.villas.trialToPaid != null ? d.villas.trialToPaid + '%' : '—', 'Villas paying (of all signed up)')}${kpi(d.avgDays.leadToTrial != null ? d.avgDays.leadToTrial + ' d' : '—', 'Avg. lead → trial')}${kpi(d.avgDays.trialToWon != null ? d.avgDays.trialToWon + ' d' : '—', 'Avg. trial → won')}</div>`;

  h += `<div class="card" style="margin-top:12px"><h2>Payments</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Villa</th><th>Kind</th><th>Source</th><th>Note</th><th class="n">Amount</th>${canPay?'<th></th>':''}</tr></thead><tbody>${d.payments.map(p => `<tr><td>${esc(fmtDay(p.at))}</td><td>${esc(p.slug)}</td><td>${esc(cap(p.kind || 'subscription'))}</td><td>${esc(p.source === 'razorpay' ? 'Razorpay' : 'By hand' + (p.by ? ' (' + p.by + ')' : ''))}</td><td>${esc(p.note || '')}</td><td class="n">${rs(p.amount)}</td>${canPay?`<td>${p.source==='manual'?`<button class="btn sm danger" data-del-pay="${esc(p.id)}">Remove</button>`:''}</td>`:''}</tr>`).join('') || `<tr><td colspan="7" class="empty">No payments recorded yet.</td></tr>`}</tbody></table></div></div>`;
  h += `<div class="card"><h2>All villas</h2><div class="scroll"><table><thead><tr><th>Villa</th><th>Plan</th><th>State</th><th>Paid to</th><th class="n">MRR</th></tr></thead><tbody>${d.villas.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(cap(v.tier || ''))}${/-annual$/.test(v.plan)?' (annual)':''}</td><td>${esc(cap(v.state))}</td><td>${esc(fmtDay(v.paidUntil))}</td><td class="n">${rs(v.mrr)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('main').innerHTML = h;
  barChart($('chRev'), d.collected.monthly.map(m => ({ label: monLabel(m.month), full: monFull(m.month), v: m.amount })), 'v', v => rs(v));
  $('main').querySelectorAll('[data-del-pay]').forEach(b => b.addEventListener('click', async () => { if (!confirm('Remove this payment record?')) return; try { await api('DELETE', '/platform/payments', { id: b.dataset.delPay }); toast('Removed'); revenue(); } catch(e) { toast(e.message); } }));
  if ($('payAdd')) $('payAdd').addEventListener('click', () => {
    $('drawerPanel').innerHTML = `<div class="head"><h1 style="font-size:19px">Record a payment</h1><div class="act"><button class="btn sm" id="pClose" type="button">Close</button></div><p>A payment received outside Razorpay (bank transfer, UPI, cheque). To also extend a villa's paid period, use Customers → Billing → Record payment.</p></div>
      <div class="fields"><label class="f"><span>Villa</span><select id="pSlug">${d.villas.filter(v => !v.isDefault).map(v => `<option value="${esc(v.slug)}">${esc(v.name)}</option>`).join('')}</select></label>
      <label class="f"><span>Amount (₹)</span><input id="pAmt" type="number" min="1" inputmode="decimal"></label>
      <label class="f"><span>Kind</span><select id="pKind"><option value="subscription">Subscription</option><option value="setup">Setup fee</option></select></label>
      <label class="f"><span>Date received</span><input id="pDate" type="date" value="${today()}"></label></div>
      <label class="f"><span>Note</span><input id="pNote" maxlength="200" placeholder="e.g. NEFT ref 1234"></label>
      <button class="btn primary" id="pSave" type="button">Save</button><div class="msg" id="pMsg"></div>`;
    $('drawer').hidden = false;
    $('pClose').addEventListener('click', closeDrawer);
    $('pSave').addEventListener('click', async () => { try { await api('POST', '/platform/payments', { slug: $('pSlug').value, amount: Number($('pAmt').value), kind: $('pKind').value, date: $('pDate').value, note: $('pNote').value }); toast('Payment recorded'); closeDrawer(); revenue(); } catch(e) { $('pMsg').className = 'msg err'; $('pMsg').textContent = e.message; } });
  });
}

// ── Plans & packages ──
async function plans(){
  const c = await api('GET', '/platform/billing');
  const feats = Object.entries(c.featureCatalog || {});
  let h = head('Plans & packages', 'Arrange what each plan includes, its price and how it\'s described. Changes apply to every villa on that plan straight away (trials always get the top plan). A new price makes a new Razorpay plan for new subscribers; existing subscribers keep theirs.', '<button class="btn primary" id="bSave" type="button">Save plans</button>');
  h += `<div class="card"><h2>Payments</h2><div class="hint" style="margin:0">Razorpay: <b>${c.razorpayConfigured ? 'connected (' + esc(c.razorpayMode) + ' mode)' : 'not set — STUDIO_RAZORPAY_KEY_ID and _SECRET on Render'}</b> · Subscription webhook: <b>${c.webhookConfigured ? 'secret set' : 'not set'}</b> — ${esc(c.webhookUrl)} with the subscription.* events</div></div>`;
  h += `<div class="card scroll"><table class="matrix"><thead><tr><th>Feature</th>${c.plans.map(p => `<th><input type="text" data-name="${p.key}" value="${esc(p.name)}" maxlength="40" aria-label="Plan name"></th>`).join('')}</tr></thead><tbody>
    <tr><td>Monthly price (₹)</td>${c.plans.map(p => `<td><input type="number" min="0" data-m="${p.key}" value="${p.monthly}"></td>`).join('')}</tr>
    <tr><td>One-time setup (₹)</td>${c.plans.map(p => `<td><input type="number" min="0" data-s="${p.key}" value="${p.setup}"></td>`).join('')}</tr>
    <tr><td>Highlight as "Popular"</td>${c.plans.map(p => `<td><input type="checkbox" data-hl="${p.key}"${p.highlight?' checked':''}></td>`).join('')}</tr>
    ${feats.map(([f, label]) => `<tr><td>${esc(label)}</td>${c.plans.map(p => `<td><input type="checkbox" data-f="${p.key}" value="${esc(f)}"${p.features.includes(f)?' checked':''} aria-label="${esc(label)} in ${esc(p.name)}"></td>`).join('')}</tr>`).join('')}
    <tr><td>Description</td>${c.plans.map(p => `<td><input type="text" data-d="${p.key}" value="${esc(p.description || '')}" maxlength="200" placeholder="Short line under the name"></td>`).join('')}</tr>
  </tbody></table></div>`;
  h += `<div class="card"><h2>Terms</h2><div class="fields">
    <label class="f"><span>Prices</span><select id="bGstMode"><option value="excl">Exclude GST (added at checkout)</option><option value="incl">Include GST</option></select></label>
    <label class="f"><span>GST (%)</span><input id="bGstPct" type="number" min="0" max="28" value="${c.gstPercent}"></label>
    <label class="f"><span>Annual = monthly × months</span><input id="bAnnual" type="number" min="1" max="12" value="${c.annualMonths}"></label>
    <label class="f"><span>Minimum term (months)</span><input id="bMinTerm" type="number" min="0" max="36" value="${c.minTermMonths}"></label>
    <label class="f"><span>Notice to cancel (days)</span><input id="bNotice" type="number" min="0" max="180" value="${c.noticeDays}"></label>
    <label class="f"><span>Free trial (days)</span><input id="bTrial" type="number" min="1" max="365" value="${c.trialDays}"></label>
    <label class="f"><span>Grace (days)</span><input id="bGrace" type="number" min="0" max="60" value="${c.graceDays}"></label>
    <label class="f"><span>Business name on invoices</span><input id="bBiz" maxlength="120" value="${esc(c.businessName || '')}"></label>
    <label class="f"><span>GSTIN</span><input id="bGstin" maxlength="15" value="${esc(c.gstin || '')}"></label></div></div>`;
  $('main').innerHTML = h;
  $('bGstMode').value = c.pricesIncludeGst ? 'incl' : 'excl';
  $('bSave').addEventListener('click', async e => {
    const tiers = {}; c.plans.forEach(p => { tiers[p.key] = { name: document.querySelector(`[data-name="${p.key}"]`).value.trim() || p.name, monthly: Number(document.querySelector(`[data-m="${p.key}"]`).value) || 0,
      setup: Number(document.querySelector(`[data-s="${p.key}"]`).value) || 0, highlight: document.querySelector(`[data-hl="${p.key}"]`).checked, description: document.querySelector(`[data-d="${p.key}"]`).value.trim(),
      features: [...document.querySelectorAll(`[data-f="${p.key}"]:checked`)].map(i => i.value) }; });
    if (!confirm('Save plans? Every villa on a plan gets its new package straight away.')) return;
    const num = id => Number($(id).value); e.currentTarget.disabled = true;
    try { await api('PUT', '/platform/billing', { tiers, pricesIncludeGst: $('bGstMode').value === 'incl', gstPercent: num('bGstPct'), annualMonths: num('bAnnual'), minTermMonths: num('bMinTerm'), noticeDays: num('bNotice'), trialDays: num('bTrial') || 14, graceDays: num('bGrace'), businessName: $('bBiz').value.trim(), gstin: $('bGstin').value.trim().toUpperCase() });
      toast('Plans saved'); plans(); } catch(err) { toast(err.message); e.currentTarget.disabled = false; }
  });
}

// ── Add & invite ──
async function invites(){
  const leads = ME.perms.includes('crm') ? (await loadLeads().catch(() => null)) : null;
  const open = leads ? leads.leads.filter(l => !l.villa && !['won', 'lost'].includes(l.stage)) : [];
  $('main').innerHTML = head('Add & invite', 'Bring a villa onto RYST Harbour: send the owner an invite link, or set the villa up yourself.')
    + `<div class="grid2"><div class="card"><h2>Invite a villa owner</h2><p class="hint">They open the link, sign in with Google and set up their own villa. The link works only for the Google account below.</p>
      ${open.length ? `<label class="f"><span>For a CRM lead (optional)</span><select id="invLead"><option value="">—</option>${open.map(l => `<option value="${esc(l.id)}" data-email="${esc(l.email || '')}">${esc(l.villaName || l.name)}</option>`).join('')}</select></label>` : ''}
      <label class="f"><span>Their Google account email</span><input id="invEmail" type="email" maxlength="200" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span>Link valid for (days)</span><input id="invDays" type="number" min="1" max="60" value="14" inputmode="numeric"></label>
      <button class="btn primary" id="invBtn" type="button">Create invite link</button><div class="msg" id="invOut"></div></div>
    <div class="card"><h2>Add a villa yourself</h2><p class="hint">For a villa you set up on the owner's behalf. Its admin signs in with the email below. The villa ID can't be changed later.</p>
      <label class="f"><span>Villa name</span><input id="vName" maxlength="120" autocomplete="off"></label>
      <label class="f"><span>Villa ID</span><input id="vSlug" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. sea-breeze"></label>
      <label class="f"><span>Admin email</span><input id="vAdmin" type="email" maxlength="200" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <button class="btn primary" id="vAdd" type="button">Add villa</button><div class="msg" id="vOut"></div></div></div>`;
  if ($('invLead')) $('invLead').addEventListener('change', e => { const o = e.target.selectedOptions[0]; if (o && o.dataset.email) $('invEmail').value = o.dataset.email; });
  $('invBtn').addEventListener('click', async e => {
    const email = $('invEmail').value.trim().toLowerCase(), days = Number($('invDays').value) || 14, out = $('invOut');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Enter their Google account email'); return; }
    e.currentTarget.disabled = true;
    try { const d = await api('POST', '/platform/invites', Object.assign({ email, days }, $('invLead') && $('invLead').value ? { leadId: $('invLead').value } : {}));
      out.className = 'msg'; out.innerHTML = `Invite for ${esc(d.email)}, valid until ${esc(fmtDay(d.expires))}:<br><input readonly value="${esc(d.link)}" style="width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2)"> <button class="btn sm" type="button" id="invCopy" style="margin-top:6px">Copy link</button>`;
      $('invCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(d.link); toast('Invite link copied'); } catch(err) { toast('Select the link and copy it'); } });
    } catch(err) { out.className = 'msg err'; out.textContent = err.message; }
    e.currentTarget.disabled = false;
  });
  $('vName').addEventListener('input', e => { const s = $('vSlug'); if (s.dataset.edited) return; s.value = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); });
  $('vSlug').addEventListener('input', e => { e.target.dataset.edited = '1'; });
  $('vAdd').addEventListener('click', async e => {
    const name = $('vName').value.trim(), slug = $('vSlug').value.trim().toLowerCase(), adminEmail = $('vAdmin').value.trim().toLowerCase(), out = $('vOut');
    if (!name) { toast('Enter the villa name'); return; }
    if (!/^[a-z0-9-]{2,40}$/.test(slug)) { toast('Villa ID: 2–40 lowercase letters, numbers or dashes'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(adminEmail)) { toast('Enter a valid admin email'); return; }
    if (!confirm(`Add "${name}" (${slug})?\n\n${adminEmail} will be its admin and can sign in right away. The villa ID can't be changed later.`)) return;
    e.currentTarget.disabled = true;
    try { await api('POST', '/platform/villas', { slug, name, adminEmail }); out.className = 'msg'; out.textContent = `${name} added — ${adminEmail} can sign in now.`;
      ['vName', 'vSlug', 'vAdmin'].forEach(id => { $(id).value = ''; delete $(id).dataset.edited; });
    } catch(err) { out.className = 'msg err'; out.textContent = err.message; }
    e.currentTarget.disabled = false;
  });
}

// ── Harbour team ──
async function team(){
  const d = await api('GET', '/platform/team'), canEdit = d.perms.includes('team');
  const roleOpts = cur => d.roles.map(r => `<option value="${r.key}"${r.key===cur?' selected':''}>${esc(r.label)}</option>`).join('');
  const permLabel = { overview:'Overview', customers:'Customers', billing:'Billing actions', crm:'CRM & conversion', invites:'Add & invite', revenue:'Revenue', plans:'Plans', team:'Team', activity:'Activity' };
  $('main').innerHTML = head('Harbour team', 'People who run RYST Harbour and can use this console. Separate from any villa\'s staff — being on the team gives no access to a villa\'s bookings or guests.')
    + `<div class="card">${d.team.map(m => `<div class="row"><div class="grow"><b>${esc(m.name || m.email)}</b>${m.name ? ` <span class="meta">${esc(m.email)}</span>` : ''}<div class="meta">${m.fixed ? 'Set on Render (PLATFORM_ADMINS)' : (m.addedBy ? (/@/.test(m.addedBy) ? 'Added by ' + esc(m.addedBy) : esc(cap(m.addedBy))) : '') + (m.addedAt ? ' · ' + esc(fmtDay(m.addedAt)) : '')}</div></div>
      ${m.email === d.me ? '<span class="pill">You</span>' : ''}
      ${canEdit && !m.fixed ? `<select class="btn sm" data-role="${esc(m.email)}" aria-label="Role">${roleOpts(m.role)}</select>${m.email !== d.me ? `<button class="btn sm danger" type="button" data-remove="${esc(m.email)}">Remove</button>` : ''}` : `<span class="pill mute">${esc((d.roles.find(r => r.key === m.role) || {}).label || m.role)}</span>`}</div>`).join('')}</div>`
    + `<div class="card"><h2>What each role can do</h2><div class="scroll"><table><thead><tr><th>Role</th><th>Can open</th></tr></thead><tbody>${d.roles.map(r => `<tr><td><b>${esc(r.label)}</b></td><td>${r.perms.map(p => esc(permLabel[p] || p)).join(' · ')}</td></tr>`).join('')}</tbody></table></div></div>`
    + (canEdit ? `<div class="card"><h2>Add someone</h2><div class="fields"><label class="f"><span>Google account email</span><input id="tEmail" type="email" maxlength="200" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span>Name (optional)</span><input id="tName" maxlength="80" autocomplete="off"></label><label class="f"><span>Role</span><select id="tRole">${roleOpts('support')}</select></label></div>
      <button class="btn primary" id="tAdd" type="button">Add to the team</button></div>` : '');
  if (!canEdit) return;
  $('main').querySelectorAll('[data-role]').forEach(s => s.addEventListener('change', async () => { try { await api('PUT', '/platform/team', { email: s.dataset.role, role: s.value }); toast('Role changed'); } catch(e) { toast(e.message); team(); } }));
  $('main').querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Remove ${b.dataset.remove} from the Harbour team? They lose access to this console straight away.`)) return;
    try { await api('DELETE', '/platform/team', { email: b.dataset.remove }); toast('Removed'); team(); } catch(e) { toast(e.message); } }));
  $('tAdd').addEventListener('click', async e => {
    const email = $('tEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Enter their Google account email'); return; }
    e.currentTarget.disabled = true;
    try { await api('POST', '/platform/team', { email, name: $('tName').value.trim(), role: $('tRole').value }); toast('Added — they can sign in here with Google'); team(); }
    catch(err) { toast(err.message); e.currentTarget.disabled = false; }
  });
}

// ── Activity ──
async function activity(){
  const d = await api('GET', '/platform/activity');
  $('main').innerHTML = head('Activity', 'Who did what in the console — billing actions, plan changes, invites, villas added, CRM moves and team changes. Last 200.')
    + `<div class="card">${d.items.length ? d.items.map(a => `<div class="row"><div class="grow">${esc(a.detail)}<div class="meta">${esc(a.by)} · ${esc(fmtWhen(a.at))}</div></div><span class="pill mute">${esc(a.action)}</span></div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div>`;
}

window.addEventListener('hashchange', () => { const p = (location.hash || '').slice(1); if (ME.perms.length && p && p !== page) go(p); });
if (token) start(); else showSignin();
