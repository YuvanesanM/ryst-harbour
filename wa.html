<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none';">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Opening WhatsApp…</title>
  <link rel="icon" href="/assets/favicon.png">
  <!-- Hand-off page for the Telegram "Tap to send via WhatsApp" nudges from
       data.ryst.in (buildWaTelegramNudge). The phone + message arrive as
       base64url JSON {p, t} in the fragment — only [A-Za-z0-9_-], so a
       Telegram client percent-decoding the link can't split the message at
       an embedded URL's `&t=` the way a direct api.whatsapp.com/send?text=
       link could. The fragment never reaches any server. -->
  <style>
    :root { --bg:#f6f3ec; --ink:#0e2420; --muted:#5a706c; --card:#fff; --line:#e3ddd0; --go:#1f9d55; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1a18; --ink:#eef3f1; --muted:#9fb3ae; --card:#172523; --line:#2a3b38; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 20px; }
    h1 { font-size:19px; margin:0 0 6px; }
    p { margin:0 0 16px; color:var(--muted); font-size:14px; }
    .btn { display:block; width:100%; text-align:center; padding:13px 16px; border-radius:12px; font-weight:600; font-size:15px; text-decoration:none; border:none; cursor:pointer; }
    .go { background:var(--go); color:#fff; margin-bottom:10px; }
    .copy { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
    pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border-radius:12px; padding:12px; font:13px/1.5 inherit; font-family:inherit; margin:16px 0 0; max-height:40vh; overflow:auto; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Opening WhatsApp…</h1>
  <p id="sub">If WhatsApp doesn't open by itself, tap the button below.</p>
  <a class="btn go" id="go" href="#">Open WhatsApp</a>
  <button class="btn copy" id="copy" type="button">Copy message</button>
  <pre id="text"></pre>
</main>
<script>
(function(){
  var data = null;
  try {
    var b64 = location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    data = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) {}
  var go = document.getElementById('go'), copy = document.getElementById('copy');
  if (!data || !data.p || typeof data.t !== 'string') {
    document.getElementById('title').textContent = 'This link is incomplete';
    document.getElementById('sub').textContent = 'Open the message again from Telegram, or resend it from the Bookings page.';
    go.style.display = copy.style.display = 'none';
    return;
  }
  var url = 'https://api.whatsapp.com/send/?phone=' + encodeURIComponent(String(data.p).replace(/\D/g,'')) + '&text=' + encodeURIComponent(data.t);
  go.href = url;
  document.getElementById('text').textContent = data.t;
  copy.addEventListener('click', function(){
    (navigator.clipboard ? navigator.clipboard.writeText(data.t) : Promise.reject())
      .then(function(){ copy.textContent = 'Copied ✓'; }, function(){ copy.textContent = 'Copy failed — select the text below'; });
  });
  location.replace(url);
})();
</script>
</body>
</html>
